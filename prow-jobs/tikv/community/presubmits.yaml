presubmits:
  tikv/community:
    - name: pull-verify
      decorate: true
      skip_if_only_changed: "(\\.(md|png|jpeg|jpg|gif|svg|pdf|gitignore)|Dockerfile|OWNERS|OWNERS_ALIASES)$"
      branches:
        - ^master$
      spec:
        containers:
          - name: check
            image: wbitt/network-multitool@sha256:98d24ba5e94c74b153603dc4022aa15100ce33bccf7d0d59f8c2a3e088c90471
            command: [bash, -ceo, pipefail]
            args:
              - |
                for f in $(find teams -name "*.json" -type f); do
                  echo -n "check file: $f ... "
                  (jq . $f > /dev/null && echo "✅") || exit 1
                done
            resources:
              limits:
                cpu: "200m"
                memory: 512Mi
              requests:
                cpu: "100m"
                memory: 256Mi

# struct ref: https://pkg.go.dev/sigs.k8s.io/prow/pkg/config#Presubmit
presubmits:
  PingCAP-QE/ee-infra:
    # Validate-only: `tofu plan` needs cloud credentials and would run
    # pull-request-authored HCL with them, so planning is not part of the PR
    # path. fmt/init -backend=false/validate need no provider credentials.
    - name: pull-ee-infra-validate-gcp-terraform
      decorate: true
      decoration_config:
        oauth_token_secret:
          name: github-token
          key: token
      max_concurrency: 1
      run_if_changed: "^terraform/gcp/pingcap-testing-account/.*\\.tf$"
      branches:
        - ^main$
      spec:
        containers:
          - name: main
            image: ghcr.io/opentofu/opentofu:1.12
            command: [sh, -ce]
            args:
              - |
                cd terraform/gcp/pingcap-testing-account
                echo "🔧 tofu fmt"
                tofu fmt -check -recursive
                echo "📦 tofu init"
                tofu init -backend=false
                echo "🔍 tofu validate"
                tofu validate
            resources:
              limits:
                memory: 256Mi
                cpu: 200m
    # Validate-only, same reason as the GCP job: no TencentCloud keys are
    # mounted for PR-authored HCL.
    - name: pull-ee-infra-validate-tencentcloud-terraform
      decorate: true
      decoration_config:
        oauth_token_secret:
          name: github-token
          key: token
      max_concurrency: 1
      run_if_changed: "^terraform/tencentcloud/.*\\.tf$"
      branches:
        - ^main$
      spec:
        containers:
          - name: main
            image: ghcr.io/opentofu/opentofu:1.12
            command: [sh, -ce]
            args:
              - |
                cd terraform/tencentcloud/tidb-cicd
                echo "🔧 tofu fmt"
                tofu fmt -check -recursive
                echo "📦 tofu init"
                tofu init -backend=false
                echo "🔍 tofu validate"
                tofu validate
            resources:
              limits:
                memory: 256Mi
                cpu: 200m

# struct ref: https://pkg.go.dev/sigs.k8s.io/prow/pkg/config#Periodic
periodics:
  - name: periodic-crawl-ci-run-data
    decorate: true # need add this.
    cron: "0 * * * *" # @hourly
    hidden: true
    spec:
      activeDeadlineSeconds: 300
      containers:
        - name: main
          image: denoland/deno:2.9.8
          command:
            - deno
            - run
            - --allow-net
            - https://cdn.jsdelivr.net/gh/PingCAP-QE/ee-apps@ba65735ce3e912bd8665b67ed17e6c72079f52ae/insight/crawlers/ci/prow-jobs.ts
          args: [--dsn=$(DSN)]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  key: ci-job-periodic-crawl-ci-run-data-dsn
                  name: ci-job-params-mono
          resources:
            requests:
              memory: 1Gi
              cpu: 200m
            limits:
              memory: 1Gi
  - name: periodic-collect-case-runs-cse
    agent: kubernetes
    cluster: default
    decorate: true
    hidden: true
    cron: "23 * * * *"
    max_concurrency: 1
    spec:
      activeDeadlineSeconds: 900
      containers:
        - name: main
          image: denoland/deno:2.9.8
          command:
            - deno
            - run
            - --allow-env
            - --allow-net
            - https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@main/tools/collectors/github-case-runs/main.ts
          env:
            # Stable GitHub ID: resolve the current repo name on every run.
            - name: REPOSITORY_ID
              value: "492109999"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            # SELECT-only dedup; INSERTs go through the CloudEvents consumer.
            - name: PARAM_DSN
              valueFrom:
                secretKeyRef:
                  name: ci-job-params-mono
                  key: ci-job-flay-report-dsn
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 1Gi
  - name: periodic-reporter-flaky-tests-cse
    agent: kubernetes
    cluster: default
    decorate: true
    hidden: true
    cron: "55 0 * * *" # Daily at 08:55 UTC+8, after the hourly collector.
    max_concurrency: 1
    spec:
      activeDeadlineSeconds: 900
      containers:
        - name: main
          image: denoland/deno:2.9.8
          command: [bash, -c]
          args:
            - |
              set -euo pipefail

              # Resolve the same stable repository identity as the collector.
              repo=$(deno eval '
                const response = await fetch("https://api.github.com/repositories/492109999", {
                  headers: {
                    Authorization: `Bearer ${Deno.env.get("GITHUB_TOKEN")}`,
                    Accept: "application/vnd.github+json",
                  },
                  redirect: "error",
                  signal: AbortSignal.timeout(30000),
                });
                if (!response.ok) throw new Error("Repository lookup failed");
                const { full_name } = await response.json();
                if (!/^[\w.-]+\/[\w.-]+$/.test(full_name)) throw new Error("Invalid repository identity");
                console.log(full_name);
              ')
              start_date=$(date -u -d "1 days ago" +%Y-%m-%d)
              end_date=$(date -u +%Y-%m-%d)
              script_url="https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@f0ebc1315d5873fd091064912b18ba6ef0e02c71/tools/reporters/ci/flaky-tests/main.ts"

              # The reporter/SDK can log private case names, including on errors.
              # Keep BOTH streams and the HTML outside public Prow artifacts.
              if deno run --allow-env --allow-net --allow-write=/tmp "${script_url}" \
                --repo "${repo}" --branch cloud-engine \
                --from "${start_date}" --to "${end_date}" \
                --issue-create --issue-comment --issue-reopen \
                --issue-labels type/bug --issue-mutation-limit 10000 \
                --html /tmp/cse-flaky-report.html \
                >/tmp/cse-flaky-reporter.log 2>&1; then
                echo "CSE flaky issue reporter completed"
              else
                echo "CSE flaky issue reporter failed; detailed logs are pod-local"
                exit 1
              fi
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ci-job-params-mono
                  key: ci-job-flay-report-dsn
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
  - name: periodic-reporter-flaky-tests-tidb
    decorate: true # need add this.
    cluster: tke-pingcap-cicd
    cron: "5 0 * * *" # Run daily at 8:05 UTC+8 (which is 00:05 UTC)
    # hidden: true
    spec:
      activeDeadlineSeconds: 300
      containers:
        - &periodic-reporter-flaky-tests-tidb-container
          name: main
          image: denoland/deno:2.9.8
          command: [bash, -c]
          args:
            - |
              #!/usr/bin/env bash
              set -euo pipefail

              script_url="https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@10bcc6134c6540cb7996f7313c96d0a6eadc2683/tools/reporters/ci/flaky-tests/main.ts"
              start_date=$(date -d "1 days ago" +%Y-%m-%d)
              end_date=$(date +%Y-%m-%d)
              email_subject="Flaky Tests Report of $PARAM_REPO repository (branch: $PARAM_BRANCH) between ${start_date} and ${end_date}"

              deno run --allow-env --allow-net --allow-write ${script_url} \
                --repo ${PARAM_REPO} \
                --branch ${PARAM_BRANCH} \
                --from ${start_date} \
                --to ${end_date} \
                --threshold-ms ${PARAM_CASE_THRESHOLD_MS} \
                --db-url=${PARAM_DSN} \
                $PARAM_ISSUE_OPS_OPTIONS --issue-labels "${PARAM_ISSUE_LABELS}" \
                --email-to="${PARAM_EMAIL_TO}" \
                --email-cc="${PARAM_EMAIL_CC}" \
                --email-from="${SMTP_USER}" \
                --email-subject="${email_subject}"
          env:
            - name: PARAM_REPO
              value: pingcap/tidb
            - name: PARAM_BRANCH
              value: master
            - name: PARAM_CASE_THRESHOLD_MS
              value: "100000"
            - name: PARAM_ISSUE_OPS_OPTIONS
              value: --issue-create --issue-reopen --issue-comment
            - name: PARAM_ISSUE_LABELS
              value: "component/test,flaky-test,type/enhancement"
            - name: ISSUE_MUTATION_LIMIT
              value: "10000"
            - name: PARAM_DSN
              valueFrom:
                secretKeyRef:
                  key: ci-job-flay-report-dsn
                  name: ci-job-params-mono
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: github-token
            - name: PARAM_EMAIL_TO
              valueFrom:
                secretKeyRef:
                  key: ci-job-flay-report-email-to
                  name: ci-job-params-mono
            - name: PARAM_EMAIL_CC
              valueFrom:
                secretKeyRef:
                  key: ci-job-flay-report-email-cc
                  name: ci-job-params-mono
            - name: SMTP_SECURE
              value: "true"
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  key: smtp-host
                  name: ci-smtp
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  key: smtp-port
                  name: ci-smtp
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  key: smtp-user
                  name: ci-smtp
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  key: smtp-password
                  name: ci-smtp
          resources:
            requests:
              memory: 1Gi
              cpu: 200m
            limits:
              memory: 1Gi

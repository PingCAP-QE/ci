# struct ref: https://pkg.go.dev/sigs.k8s.io/prow/pkg/config#Presubmit
presubmits:
  pingcap/tidb-engine-ext:
    - name: pull-unit-test
      decorate: true # need add this.
      always_run: true
      skip_submodules: true
      clone_depth: 0 # do a full clone.
      branches:
        - ^master$
        - ^raftstore-proxy$
        - ^(raftstore-proxy-)?6\.[2-9]\d*(\.\d+)?(\-.*)?$
        - ^(raftstore-proxy-)?[789]\.[0-9]\d*(\.\d+)?(\-.*)?$
      spec:
        containers:
          - name: unit-test
            image: ghcr.io/pingcap-qe/cd/builders/tiflash:v2026.3.8-1-g9d412f4_linux_amd64
            command: [bash, -ce]
            args:
              - |
                set -euox pipefail
                make ci_fmt_check
                make ci_test
            env:
              - name: CARGO_NET_GIT_FETCH_WITH_CLI
                value: "true"
              # One-shot CI builds never reuse incremental artifacts, they only
              # inflate target/ (tens of GiB) on the node root disk.
              - name: CARGO_INCREMENTAL
                value: "0"
              # Keep the Rust build artifacts off the node root disk. A 100 GB
              # boot disk only exposes ~43.8Gi of ephemeral-storage after GKE
              # reservations, while a single `make ci_test` run (three
              # `cargo test` invocations with different --features sets, each
              # recompiling the same crates under a new feature hash) writes
              # 40Gi+ and got the pod evicted mid-build:
              #   Evicted: The node was low on resource: ephemeral-storage
              #   Evicted: ... exceeds the total limit of containers 40Gi
              - name: CARGO_TARGET_DIR
                value: /workspace/target
            volumeMounts:
              - name: workspace
                mountPath: /workspace
            resources:
              # Only the checkout, the cargo home and the logs stay on the node
              # disk (~10Gi); target/ lives on the workspace volume below.
              requests:
                memory: 32Gi
                cpu: "12"
                ephemeral-storage: 20Gi
              limits:
                memory: 32Gi
                cpu: "12"
                ephemeral-storage: 30Gi
        # Scratch space for target/, provisioned per pod and deleted with it.
        # `ci-rwo` is the cluster-neutral CI workspace class (GKE:
        # hyperdisk-balanced, 10k IOPS / 400MiB/s; Tencent Cloud: CBS HSSD), so
        # moving this job to `cluster: tke-pingcap-cicd` needs no spec change.
        volumes:
          - name: workspace
            ephemeral:
              volumeClaimTemplate:
                metadata:
                  labels:
                    type: ephemeral
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: ci-rwo
                  resources:
                    requests:
                      storage: 200Gi
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64

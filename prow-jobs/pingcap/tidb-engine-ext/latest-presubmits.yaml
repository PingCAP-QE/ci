# struct ref: https://pkg.go.dev/sigs.k8s.io/prow/pkg/config#Presubmit
presubmits:
  pingcap/tidb-engine-ext:
    - name: pull-unit-test
      decorate: true # need add this.
      always_run: true
      skip_submodules: true
      clone_depth: 0 # do a full clone.
      branches:
        - ^master$
        - ^raftstore-proxy$
        - ^(raftstore-proxy-)?6\.[2-9]\d*(\.\d+)?(\-.*)?$
        - ^(raftstore-proxy-)?[789]\.[0-9]\d*(\.\d+)?(\-.*)?$
      spec:
        containers:
          - name: unit-test
            image: ghcr.io/pingcap-qe/cd/builders/tiflash:v2026.3.8-1-g9d412f4_linux_amd64
            command: [bash, -ce]
            args:
              - |
                set -euox pipefail
                make ci_fmt_check
                make ci_test
            env:
              - name: CARGO_NET_GIT_FETCH_WITH_CLI
                value: "true"
              # One-shot CI builds never reuse incremental artifacts, they only
              # inflate target/ (tens of GiB) on the node root disk.
              - name: CARGO_INCREMENTAL
                value: "0"
            resources:
              # The Rust build is ephemeral-storage bound: the NAP nodes expose
              # ~43Gi allocatable and kubelet evicts a pod once free space drops
              # below ~9.4Gi. Without an ephemeral-storage request the pod is
              # the first eviction candidate, which surfaced as
              # "The node was low on resource: ephemeral-storage" (SIGTERM ->
              # ABORTED) and later as clang "No space left on device".
              requests:
                memory: 32Gi
                cpu: "12"
                ephemeral-storage: 30Gi
              limits:
                memory: 32Gi
                cpu: "12"
                ephemeral-storage: 40Gi
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64

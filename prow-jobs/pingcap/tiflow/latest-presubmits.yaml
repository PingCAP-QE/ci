global_definitions:
  branches: &branches
    - ^master$
    - ^feature/.+
  skip_if_only_changed: &skip_if_only_changed "(\\.(md|png|jpeg|jpg|gif|svg|pdf)|Dockerfile|OWNERS|OWNERS_ALIASES)$"
  skip_if_only_changed_non_ticdc_files: &skip_if_only_changed_non_ticdc_files "(^dm/|^engine/|^cmd/dm-[^/]+/|(\\.(md|png|jpeg|jpg|gif|svg|pdf)|Dockerfile|OWNERS|OWNERS_ALIASES)$)"

# struct ref: https://pkg.go.dev/sigs.k8s.io/prow/pkg/config#Presubmit
presubmits:
  pingcap/tiflow:
    - name: pull-check
      cluster: default
      decorate: true
      skip_if_only_changed: *skip_if_only_changed
      branches: *branches
      spec:
        containers:
          - name: check
            image: ghcr.io/pingcap-qe/ci/base:v2026.4.12-10-gc29110c-go1.25
            command: [bash, -ce]
            args:
              - |
                make check
            resources: &resources
              requests:
                memory: 12Gi
                cpu: "3"
              limits:
                memory: 24Gi
                cpu: "6"

    - name: pull-build
      cluster: default
      decorate: true
      skip_if_only_changed: *skip_if_only_changed
      branches: *branches
      spec:
        containers:
          - name: build
            image: ghcr.io/pingcap-qe/ci/base:v2026.4.12-10-gc29110c-go1.25
            command: [bash, -ce]
            args:
              - |
                make build
            resources: *resources

    - name: pull-unit-test-cdc
      cluster: default
      decorate: true
      skip_if_only_changed: *skip_if_only_changed
      branches: *branches
      spec:
        containers:
          - name: cdc-unit-test
            image: ghcr.io/pingcap-qe/ci/base:v2026.4.12-10-gc29110c-go1.25
            command: [bash, -ce]
            args:
              - |
                # Preserve junit artifacts for Prow even when tests fail.
                archive_junit_reports() {
                  local report
                  shopt -s globstar nullglob
                  mkdir -p "${ARTIFACTS}" || return 0
                  for report in ./**/*-junit-report.xml; do
                    cp -f "$report" "${ARTIFACTS}/$(basename "$report")" || true
                  done
                }
                trap archive_junit_reports EXIT

                make unit_test_in_verify_ci
            resources:
              requests:
                memory: 24Gi
                cpu: "6"
              limits:
                memory: 24Gi
                cpu: "6"

    - name: pingcap/tiflow/pull_cdc_integration_kafka_test
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      always_run: false
      skip_if_only_changed: *skip_if_only_changed_non_ticdc_files
      run_before_merge: true
      context: pull-cdc-integration-kafka-test
      trigger: "(?m)^/test (?:.*? )?(pull-cdc-integration-kafka-test|all)(?: .*?)?$"
      rerun_command: "/test pull-cdc-integration-kafka-test"
      branches: *branches

    # TODO: combine other CDC integration tests to a single one,
    # Currently we keep the Jenkins job name.
    - name: pingcap/tiflow/pull_cdc_integration_test
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      always_run: false
      skip_if_only_changed: *skip_if_only_changed_non_ticdc_files
      run_before_merge: true
      context: pull-cdc-integration-mysql-test
      trigger: "(?m)^/test (?:.*? )?(pull-cdc-integration-mysql-test|all)(?: .*?)?$"
      rerun_command: "/test pull-cdc-integration-mysql-test"
      branches: *branches

    - name: pingcap/tiflow/pull_cdc_integration_storage_test
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      always_run: false
      skip_if_only_changed: *skip_if_only_changed_non_ticdc_files
      run_before_merge: true
      context: pull-cdc-integration-storage-test
      trigger: "(?m)^/test (?:.*? )?(pull-cdc-integration-storage-test|all)(?: .*?)?$"
      rerun_command: "/test pull-cdc-integration-storage-test"
      branches: *branches

    - name: pingcap/tiflow/pull_cdc_integration_pulsar_test
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      always_run: false
      skip_if_only_changed: *skip_if_only_changed_non_ticdc_files
      run_before_merge: true
      context: pull-cdc-integration-pulsar-test
      trigger: "(?m)^/test (?:.*? )?(pull-cdc-integration-pulsar-test|all)(?: .*?)?$"
      rerun_command: "/test pull-cdc-integration-pulsar-test"
      branches: *branches

    - name: pingcap/tiflow/pull_dm_compatibility_test
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      always_run: false
      skip_if_only_changed: *skip_if_only_changed
      run_before_merge: true
      context: pull-dm-compatibility-test
      trigger: "(?m)^/test (?:.*? )?(pull-dm-compatibility-test|all)(?: .*?)?$"
      rerun_command: "/test pull-dm-compatibility-test"
      branches: *branches

    - name: pingcap/tiflow/pull_dm_integration_test
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      always_run: false
      run_if_changed: "^(dm/.*|pkg/.*|sync_diff_inspector/.*|go\\.mod)$"
      run_before_merge: true
      context: pull-dm-integration-test
      trigger: "(?m)^/test (?:.*? )?(pull-dm-integration-test|all)(?: .*?)?$"
      rerun_command: "/test pull-dm-integration-test"
      branches: *branches

    # Staging compatibility trial: retain the required MySQL 8.0 job above.
    # Do not add this context to branch protection or required Tide contexts.
    - name: pingcap/tiflow/staging/pull_dm_integration_test_mysql84
      agent: jenkins
      labels:
        master: "0"
      decorate: false
      always_run: false
      optional: true
      run_before_merge: false
      context: pull-dm-integration-test-mysql84
      trigger: '(?m)^/test pull-dm-integration-test-mysql84\s*$'
      rerun_command: "/test pull-dm-integration-test-mysql84"
      branches:
        - ^master$

    - name: pingcap/tiflow/pull_syncdiff_integration_test
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      always_run: false
      skip_if_only_changed: *skip_if_only_changed
      context: pull-syncdiff-integration-test
      trigger: "(?m)^/test (?:.*? )?(pull-syncdiff-integration-test|all)(?: .*?)?$"
      rerun_command: "/test pull-syncdiff-integration-test"
      branches: *branches

    - name: pingcap/tiflow/ghpr_verify
      agent: jenkins
      labels:
        master: "0"
      decorate: false # need add this.
      skip_if_only_changed: *skip_if_only_changed
      context: pull-verify
      trigger: "(?m)^/test (?:.*? )?pull-verify(?: .*?)?$"
      rerun_command: "/test pull-verify"
      branches: *branches

    - name: pull-unit-test
      decorate: true # need add this.
      # skip_if_only_changed: *skip_if_only_changed
      run_before_merge: true
      branches:
        - ^master$
        - ^release-8\.5(\.\d+)?(-\d+)?(-v[\.\d]+)?(-\d+)?$
        - ^feature/release-8\.5-materialized-view-8\.5\.8$
      spec:
        containers:
          - name: check
            image: &image ghcr.io/pingcap-qe/ci/base:v2026.3.15-1-g5625431-go1.25
            command: [bash, -ce]
            args:
              - |
                make unit_test_in_verify_ci
            resources:
              requests:
                memory: 24Gi
                cpu: "12"
              limits:
                memory: 24Gi
                cpu: "12"

    - name: pull-build
      decorate: true # need add this.
      # skip_if_only_changed: *skip_if_only_changed
      run_before_merge: true
      branches:
        - ^master$
        - ^release-8\.5(\.\d+)?(-\d+)?(-v[\.\d]+)?(-\d+)?$
      spec:
        containers:
          - name: build
            image: *image
            command: [bash, -ce]
            args:
              - |
                make cdc
            resources: &resources
              requests:
                memory: 12Gi
                cpu: "6"
              limits:
                memory: 24Gi
                cpu: "6"

    - name: pull-check
      decorate: true # need add this.
      # skip_if_only_changed: *skip_if_only_changed
      run_before_merge: true
      branches:
        - ^master$
        - ^release-8\.5(\.\d+)?(-\d+)?(-v[\.\d]+)?(-\d+)?$
      spec:
        containers:
          - name: check
            image: *image
            command: [bash, -ce]
            args:
              - |
                make check
            resources: *resources

apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: golang
      image: "us-docker.pkg.dev/pingcap-testing-account/internal/test/wangweizhen/tidb_image:go12320241009"
      securityContext:
        privileged: true
      tty: true
      resources:
        requests:
          memory: 24Gi
          cpu: "3"
        limits:
          memory: 24Gi
          cpu: "3"
      volumeMounts:
        - mountPath: /home/jenkins/.tidb
          name: bazel-out-merged
        - name: bazel-rc
          mountPath: /data/
          readOnly: true
        - name: containerinfo
          mountPath: /etc/containerinfo
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -ec
              - |
                # TiDB writes DDL ingest and IMPORT INTO files under /tmp/tidb by default.
                # postStart runs as root, but Jenkins executes CI steps as UID/GID 1000.
                tidb_tmp=/home/jenkins/agent/tidb-tmp
                mkdir -p "${tidb_tmp}"
                chown -R 1000:1000 "${tidb_tmp}"
                chmod 0775 "${tidb_tmp}"

                # The image pre-creates /tmp/tidb. Replace it before test steps start, then
                # bind-mount the writable workspace directory so Bazel does not resolve a symlink
                # to a path it mounts read-only in its test sandbox.
                rm -rf /tmp/tidb
                mkdir -p /tmp/tidb
                mount --bind "${tidb_tmp}" /tmp/tidb
                mount -o remount,bind,rw /tmp/tidb

                # ConfigMap-mounted scripts are not executable; keep the shell invocation.
                /bin/sh /data/bazel-prepare-in-container.sh
    - name: utils
      image: us-docker.pkg.dev/pingcap-testing-account/ghcr-remote/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      tty: true
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          cpu: "1"
          memory: 4Gi
  volumes:
    - name: bazel-out-merged
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 150Gi
            storageClassName: ci-rwo
    - name: bazel-rc
      configMap:
        name: bazel
    - name: containerinfo
      downwardAPI:
        items:
          - path: cpu_limit
            resourceFieldRef:
              containerName: golang
              resource: limits.cpu
          - path: cpu_request
            resourceFieldRef:
              containerName: golang
              resource: requests.cpu
          - path: mem_limit
            resourceFieldRef:
              containerName: golang
              resource: limits.memory
          - path: mem_request
            resourceFieldRef:
              containerName: golang
              resource: requests.memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

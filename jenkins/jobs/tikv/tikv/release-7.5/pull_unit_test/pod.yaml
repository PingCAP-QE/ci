apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: runner
      image: "ghcr.io/pingcap-qe/ci/jenkins/tikv:v2026.3.22-4-gd9d1135"
      tty: true
      command:
        - "/bin/sh"
        - "-c"
      args:
        - "cat"
      env:
        # tikv 6.5/7.1/7.5 pin rust-toolchain nightly-2022-11-15 (cargo < 1.68),
        # where a sparse registry requires `-Z sparse-registry`. The CI cluster
        # injects a sparse crates.io mirror, so enable that unstable flag.
        - name: CARGO_UNSTABLE_SPARSE_REGISTRY
          value: "true"
      resources:
        requests:
          memory: 24Gi
          cpu: "6"
        limits:
          memory: 24Gi
          cpu: "6"
      securityContext:
        privileged: true
      volumeMounts:
      - mountPath: "/home/jenkins/agent/memvolume"
        name: "volume-memory"
        readOnly: false
      - mountPath: "/tmp"
        name: "volume-tmp"
        readOnly: false
  volumes:
  - emptyDir:
      medium: ""
    name: "volume-tmp"
  - emptyDir:
      medium: Memory
    name: "volume-memory"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

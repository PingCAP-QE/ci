apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: zookeeper
      image: wurstmeister/zookeeper
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 2Gi
          cpu: 500m
        limits:
          memory: 2Gi
          cpu: 500m
      tty: true
      volumeMounts:
        - mountPath: /tmp
          name: volume-0
    - name: kafka
      image: wurstmeister/kafka:2.12-2.4.1
      imagePullPolicy: IfNotPresent
      env:
        - name: KAFKA_CREATE_TOPICS
          value: big-message-test:1:1
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: localhost:2181
        - name: KAFKA_MESSAGE_MAX_BYTES
          value: "11534336"
        - name: KAFKA_REPLICA_FETCH_MAX_BYTES
          value: "11534336"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://127.0.0.1:9092
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://127.0.0.1:9092
        - name: ZK
          value: zk
      resources:
        requests:
          memory: 2Gi
          cpu: 500m
        limits:
          memory: 2Gi
          cpu: 500m
      tty: true
      volumeMounts:
        - mountPath: /tmp
          name: volume-0
    - args:
        - cat
      image: ghcr.io/pingcap-qe/ci/jenkins:v2026.3.29-14-g90ae7ef-go1.25
      imagePullPolicy: Always
      name: golang
      resources:
        requests:
          memory: 16Gi
          cpu: "4"
        limits:
          memory: 16Gi
          cpu: "4"
      tty: true
      volumeMounts:
        - mountPath: /tmp
          name: volume-0
    - name: utils
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      tty: true
      resources:
        requests:
          memory: 1Gi
          cpu: "1"
        limits:
          memory: 1Gi
          cpu: "1"
  volumes:
    - emptyDir: {}
      name: volume-0
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

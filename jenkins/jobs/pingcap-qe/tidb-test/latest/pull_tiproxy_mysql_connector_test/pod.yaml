apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: golang
      image: ghcr.io/pingcap-qe/ci/jenkins:v2026.3.29-14-g90ae7ef-go1.25
      tty: true
      resources:
        requests:
          memory: 12Gi
          cpu: "3"
        limits:
          memory: 12Gi
          cpu: "3"
    - name: mysql-client-test
      # pinned 2026-11-04: was :latest, digest resolved from a running pod
      image: us-docker.pkg.dev/pingcap-testing-account/internal/test/tiproxy-team/mysql-client-test@sha256:1ee3ca02da8830671fb6501adb980850d9f81540074d9f2eeddbf1f3472ac997
      tty: true
      resources:
        requests:
          memory: 12Gi
          cpu: "3"
        limits:
          memory: 12Gi
          cpu: "3"
    - name: utils
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      tty: true
      resources:
        requests:
          memory: 1Gi
          cpu: "1"
        limits:
          memory: 1Gi
          cpu: "1"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: golang
      image: "ghcr.io/pingcap-qe/ci/jenkins:v2026.4.12-10-gc29110c-go1.25"
      tty: true
      # Guaranteed QoS (requests == limits). This container hosts the whole
      # TiDB/TiKV/PD/TiFlash/Kafka stack, so the 16Gi/16Gi budget set by
      # FLA-303 was below the suite's peak and caused hard failures
      # (e.g. "Region is unavailable"). Restore the original 32Gi ceiling and
      # raise the request to match it.
      resources:
        requests:
          memory: 32Gi
          cpu: "6"
        limits:
          memory: 32Gi
          cpu: "6"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

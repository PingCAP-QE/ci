apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - image: wurstmeister/zookeeper@sha256:7a7fd44a72104bfbd24a77844bad5fabc86485b036f988ea927d1780782a6680
      imagePullPolicy: IfNotPresent
      name: zookeeper
      resources:
        requests:
          cpu: 1000m
          memory: 4Gi
        limits:
          cpu: 1000m
          memory: 4Gi
      tty: true
      volumeMounts:
        - mountPath: /tmp
          name: test-tmp
    - image: ghcr.io/pingcap-qe/ci/jenkins:v2026.6.28-8-g92327eaa-go1.25
      command: [tini, --, bash]
      imagePullPolicy: Always
      name: golang
      resources:
        limits:
          cpu: "8"
          memory: 24Gi
      tty: true
      volumeMounts:
        - mountPath: /tmp
          name: test-tmp
    - env:
        - name: KAFKA_CREATE_TOPICS
          value: big-message-test:1:1
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_SSL_KEYSTORE_PASSWORD
          value: test1234
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: localhost:2181
        - name: KAFKA_MESSAGE_MAX_BYTES
          value: "11534336"
        - name: KAFKA_REPLICA_FETCH_MAX_BYTES
          value: "11534336"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: SSL://127.0.0.1:9093,PLAINTEXT://127.0.0.1:9092
        - name: ZK
          value: zk
        - name: KAFKA_SSL_KEYSTORE_LOCATION
          value: /tmp/kafka.server.keystore.jks
        - name: KAFKA_SSL_KEY_PASSWORD
          value: test1234
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          value: test1234
        - name: KAFKA_LISTENERS
          value: SSL://127.0.0.1:9093,PLAINTEXT://127.0.0.1:9092
        - name: KAFKA_SSL_TRUSTSTORE_LOCATION
          value: /tmp/kafka.server.truststore.jks
        - name: RACK_COMMAND
          value: curl -sfL https://cdn.jsdelivr.net/gh/pingcap/tiflow@6e62afcfecc4e3965d8818784327d4bf2600d9fa/tests/_certificates/kafka.server.keystore.jks -o /tmp/kafka.server.keystore.jks && curl -sfL https://cdn.jsdelivr.net/gh/pingcap/tiflow@6e62afcfecc4e3965d8818784327d4bf2600d9fa/tests/_certificates/kafka.server.truststore.jks -o /tmp/kafka.server.truststore.jks
      image: wurstmeister/kafka@sha256:21b9367ff68e379b196a9c1a0bb5dc6a51740e4f87c630d2c2d672e10c9e9de7
      imagePullPolicy: IfNotPresent
      name: kafka
      resources:
        requests:
          cpu: 2000m
          memory: 6Gi
        limits:
          cpu: 2000m
          memory: 6Gi
      tty: true
      volumeMounts:
        - mountPath: /tmp
          name: test-tmp
    - env:
        - name: KAFKA_SERVER
          value: 127.0.0.1:9092
        - name: ZOOKEEPER_SERVER
          value: 127.0.0.1:2181
        - name: DOWNSTREAM_DB_HOST
          value: 127.0.0.1
        - name: USE_FLAT_MESSAGE
          value: "true"
        - name: DOWNSTREAM_DB_PORT
          value: "3306"
        - name: DB_NAME
          value: test
      image: rustinliu/ticdc-canal-json-adapter@sha256:02c644197d63cecd2de3ff9967fa2e25e0ef3a42c46752c3ca3ca6f4d7c91a1e
      imagePullPolicy: IfNotPresent
      name: canal-adapter
      # TODO: add resource limit
      # can't add resource limit now, because canal-adapter will OOM
      # issue: https://github.com/PingCAP-QE/ci/issues/1893
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
      tty: true
      volumeMounts:
        - mountPath: /tmp
          name: test-tmp
    - name: mysql
      image: quay.io/debezium/example-mysql:2.4
      imagePullPolicy: IfNotPresent
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: ""
        - name: MYSQL_USER
          value: mysqluser
        - name: MYSQL_PASSWORD
          value: mysqlpw
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: "yes"
        - name: MYSQL_TCP_PORT
          value: "3310"
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
    - name: connect
      image: quay.io/debezium/connect:2.4
      env:
        - name: BOOTSTRAP_SERVERS
          value: "127.0.0.1:9092"
        - name: GROUP_ID
          value: "1"
        - name: CONFIG_STORAGE_TOPIC
          value: "my_connect_configs"
        - name: OFFSET_STORAGE_TOPIC
          value: "my_connect_offsets"
        - name: STATUS_STORAGE_TOPIC
          value: "my_connect_statuses"
        - name: LANG
          value: "C.UTF-8"
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
  volumes:
    - name: test-tmp
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: ci-rwo
            resources:
              requests:
                storage: 100Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

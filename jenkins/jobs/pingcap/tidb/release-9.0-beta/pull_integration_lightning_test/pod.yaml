apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: golang
      image: "us-docker.pkg.dev/pingcap-testing-account/internal/test/jenkins/centos7_golang-1.23:latest"
      tty: true
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -ec
              - |
                if [ ! -e /tmp/tidb ]; then
                  mkdir -p /home/jenkins/agent/tidb-tmp
                  ln -s /home/jenkins/agent/tidb-tmp /tmp/tidb
                fi
      resources:
        requests:
          memory: 32Gi
          cpu: "4"
        limits:
          memory: 32Gi
          cpu: "4"
    - name: utils
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      tty: true
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          cpu: "1"
          memory: 4Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

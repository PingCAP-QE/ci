apiVersion: v1
kind: Pod
spec:
  containers:
    - name: runner
      image: "ghcr.io/pingcap-qe/cd/builders/tiflash:v20231106"
      command:
        - "cat"
      tty: true
      resources:
        requests:
          memory: "32Gi"
          cpu: "12"
        limits:
          memory: "32Gi"
          cpu: "12"
      volumeMounts:
        - mountPath: "/tmp-memfs"
          name: "tmp-memfs"
          readOnly: false
  volumes:
    - name: "tmp-memfs"
      emptyDir:
        medium: Memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

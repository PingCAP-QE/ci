apiVersion: v1
kind: Pod
spec:
  securityContext:
    fsGroup: 1000
  containers:
    - name: runner
      image: "ghcr.io/pingcap-qe/cd/builders/tiflash:v20231106"
      command:
        - "/bin/bash"
        - "-c"
        - "cat"
      tty: true
      resources:
        requests:
          memory: "32Gi"
          cpu: "16000m"
        limits:
          memory: "32Gi"
          cpu: "16000m"
      volumeMounts:
        - mountPath: "/tmp"
          name: "tmp"
          readOnly: false
        - mountPath: "/tmp-memfs"
          name: "tmp-memfs"
          readOnly: false
    - name: utils
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      args: ["sleep", "infinity"]
      resources:
        requests:
          memory: 1Gi
          cpu: "1"
        limits:
          memory: 1Gi
          cpu: "1"
  volumes:
    - name: "tmp"
      emptyDir: {}
    - name: "tmp-memfs"
      emptyDir:
        medium: Memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

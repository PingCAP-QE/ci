apiVersion: v1
kind: Pod
spec:
  containers:
    - name: runner
      image: "ghcr.io/pingcap-qe/cd/builders/tiflash:v2025.4.15-rocky8-llvm-17.0.6-v2"
      command:
        - "cat"
      tty: true
      resources:
        requests:
          memory: "32Gi"
          cpu: "12000m"
        limits:
          memory: "32Gi"
          cpu: "12000m"
      volumeMounts:
        - mountPath: "/tmp"
          name: "volume-6"
          readOnly: false
        - mountPath: "/tmp-memfs"
          name: "volume-7"
          readOnly: false
        - mountPath: "/home/jenkins"
          name: "volume-8"
          readOnly: false
  volumes:
    - name: "volume-6"
      emptyDir: {}
    - name: "volume-7"
      emptyDir:
        medium: Memory
    - name: "volume-8"
      emptyDir: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64

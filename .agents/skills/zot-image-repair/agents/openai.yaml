interface:
  display_name: "Zot Image Repair"
  short_description: "Repair broken hub-zot registry images with crane + ks3util"
  default_prompt: "Use $zot-image-repair to validate and repair a broken image on hub-zot.pingcap.net. Start with its Prepare section: fetch only tools/validate-repair-zot-image.sh (no full repo clone), make sure crane, ks3util, jq and bash 4.3+ are available, and confirm the ks3utilconfig credentials work. Then confirm the target image with the user, derive the source image from the mirror path, use bucket ee-zot, and let the script pick the KS3 endpoint (intranet first, extranet fallback). Never write a second repair implementation and never commit or print credentials."

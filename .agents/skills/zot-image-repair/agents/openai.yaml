interface:
  display_name: "Zot Image Repair"
  short_description: "Repair broken hub-zot registry images with crane + ks3util"
  default_prompt: "Use $zot-image-repair to validate and repair a broken image on hub-zot.pingcap.net by running tools/validate-repair-zot-image.sh (crane + ks3util, no Tekton task). Confirm the target image with the user, derive the source image from the mirror path, use bucket ee-zot and the user's ks3utilconfig, and let the script pick the KS3 endpoint (intranet first, extranet fallback). Never write a second repair implementation and never commit or print credentials."

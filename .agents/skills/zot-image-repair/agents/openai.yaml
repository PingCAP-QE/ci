interface:
  display_name: "Zot Image Repair"
  short_description: "Repair broken hub-zot registry images via Tekton task"
  default_prompt: "Use $zot-image-repair to validate and repair a broken image on hub-zot.pingcap.net by launching the zot-validate-repair-image Tekton task. First confirm the target cluster context and namespace with the user by offering discovered choices, then derive the source image from the mirror path, confirm the S3 bucket (known: ee-zot) and ks3utilconfig secret workspace in that namespace, follow the TaskRun with tkn, and never repair the zot S3 backend locally."

ci:
  autofix_commit_msg: |
    fix: auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_commit_msg: "chore(ci): pre-commit autoupdate"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args:
          - --multi
        fail_fast: true
        files: '[.](yml|yaml)$'
        types:
          - text
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-jenkins-job-references
        name: Check Jenkins job references resolve
        entry: bash .ci/check-jenkins-job-references.sh --quiet
        language: system
        pass_filenames: false
        files: '^(jobs|jenkins|pipelines)/|^\.ci/(check-jenkins-job-references|test-check-jenkins-job-references|test-migrate-jenkins-jobs)\.sh$|^scripts/migrate-jenkins-jobs\.sh$'

# RBAC for `.ci/verify-prow-jobs-run.sh` dynamic validation: it actually creates
# a ProwJob (prowjobs.prow.k8s.io) on the prow cluster to validate that changed
# kubernetes-agent prow jobs start (image pulls + command boots), then deletes it.
#
# Apply to the prow cluster. Replace $PROW_NAMESPACE with the namespace the prow
# job pods run in (the one that executes `.ci/verify-prow-jobs-run.sh`), e.g.:
#
#   kubectl apply -n <prow-job-namespace> -f configs/prow-job-validation/rbac.yaml
#
# The presubmit `pull-verify-prow-jobs-run` runs with the default ServiceAccount
# of that namespace, so we bind to it here. Until this is applied the presubmit
# still runs its static checks and only skips the dynamic ProwJob creation.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prow-job-validation
rules:
  # create/watch/delete the validation ProwJob
  - apiGroups: ["prow.k8s.io"]
    resources: ["prowjobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # observe the pod plank spawns for the ProwJob
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prow-job-validation
subjects:
  - kind: ServiceAccount
    name: default
    namespace: $PROW_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prow-job-validation

# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Pipeline.json
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pingcap-build-package-darwin-mac
spec:
  params:
    - name: git-url
      type: string
    - name: git-ref
      type: string
      default: master
    - name: git-refspec
      default: +refs/heads/*:refs/heads/*
      type: string
    - name: git-revision
      default: master
      type: string
    - name: component
      type: string
    - name: os
      default: darwin
    - name: arch
      default: amd64
    - name: profile
      default: release
    - name: push
      default: "true"
    - name: registry
      description: the base OCI registry server for store artifacts, it can be set with prefix repo path.
    - name: publisher-url
      description: The URL of the running publisher server
  results:
    - name: pushed-binaries
      description: pushed binaries.
      value: "$(tasks.build-binaries.results.pushed)"
  tasks:
    # The MacBuild CR performs checkout/build/publish on the macOS worker itself,
    # so the only pipeline tasks are the custom task and the artifact delivery.
    - name: build-binaries
      taskRef:
        apiVersion: tibuild.pingcap.net/v1alpha1
        kind: MacBuild
      params:
        - name: git-url
          value: "$(params.git-url)"
        - name: git-ref
          value: "$(params.git-ref)"
        - name: git-revision
          value: "$(params.git-revision)"
        - name: git-refspec
          value: "$(params.git-refspec)"
        - name: component
          value: "$(params.component)"
        - name: os
          value: "$(params.os)"
        - name: arch
          value: "$(params.arch)"
        - name: profile
          value: "$(params.profile)"
        - name: push
          value: "$(params.push)"
        - name: registry
          value: "$(params.registry)"
        - name: ttl-seconds-after-finished
          value: "86400"
    - name: deliver-binaries
      retries: 2
      when:
        - input: $(tasks.build-binaries.results.pushed)
          operator: notin
          values: ["{}", '"{}"']
        # Dev-builds have no publisher-url; skip the delivery step entirely.
        - input: "$(params.publisher-url)"
          operator: notin
          values: [""]
      taskRef:
        name: pingcap-deliver-binaries
      runAfter:
        - build-binaries
      params:
        - name: src-type
          value: oci-info
        - name: src
          value: $(tasks.build-binaries.results.pushed)
        - name: publisher-url
          value: "$(params.publisher-url)"

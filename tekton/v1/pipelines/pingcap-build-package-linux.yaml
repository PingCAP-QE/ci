# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Pipeline.json
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pingcap-build-package-linux
spec:
  params:
    - name: git-url
      type: string
    - name: git-ref
      type: string
      default: master
    - name: git-refspec
      default: +refs/heads/*:refs/heads/*
      type: string
    - name: git-revision
      default: master
      type: string
    - name: git-instead-of
      description: |
        Configure Git to use `git instead` for specific operations to speed up cloning.
        You can specify multiple `insteadOf` configurations separated by commas.
        For example: `insteadof1 => new1,insteadof2 => new2
      type: string
      default: ""
    - name: component
      type: string
      description: |
        compoent name, supports:
        - advanced-statefulset
        - pd
        - ticdc
        - tidb
        - tidb-operator
        - tiflash
        - tiflow
        - tikv
        - tiproxy
        - tici

        May be it is an idea to judge it by git-url, but it maybe
        not a generic way for forked repositories with custom names.
    - name: os
      default: linux
    - name: arch
      default: amd64
    - name: profile
      default: release
    - name: push
      default: "true"
    - name: registry
      description: the base OCI registry server for store artifacts, it can be set with prefix repo path.
    - name: force-builder-image
      description: >
        The builder image to use for building binaries by force, if empty.
        Default the task will complete one from config in artifacts.git repo.
      type: string
      default: ""
    - name: publisher-url
      description: The URL of the running publisher server
    - name: image-publisher-url
      description: >-
        Base URL of the TiBuild publish API used for image delivery. Empty keeps
        the legacy deno generator path (a task-level fallback during the
        image_delivery_consolidation rollout). It merges into publisher-url once
        the TiUP domain also moves into tibuild-v2.
      type: string
      default: ""
    - name: external-git-ref
      description: >-
        Explicit enterprise-plugin ref. When non-empty, the git-clone task
        skips resolution and checks out this ref directly.
      type: string
      default: ""
    - name: fetch-external
      description: Fetch the external enterprise-plugin repo during checkout.
      type: string
      default: "false"
    - name: git-auth-app
      description: >-
        Authenticate git with GitHub App installation tokens from the in-cluster
        token broker. Set to "false" to fall back to the previous credentials.
      type: string
      default: "true"
    - name: git-auth-broker-url
      description: Base URL of the in-cluster token broker.
      type: string
      default: "http://github-token-broker.github-token-broker.svc"
    - name: git-auth-fallback-credentials
      description: >-
        Path to a .git-credentials file used when the broker denies the request.
        Empty makes git fail explicitly for repositories outside the App.
      type: string
      default: ""
  results:
    - name: git-auth-mode
      description: Credential source used by checkout (app, pat, unused or disabled).
      value: "$(tasks.checkout.results.git-auth-mode)"
    - name: pushed-binaries
      description: pushed binaries.
      value: "$(tasks.build-binaries.results.pushed)"
    - name: pushed-images
      description: pushed single images.
      value: "$(tasks.build-images.results.pushed)"
  workspaces:
    - name: git-credentials
      optional: true
    - name: source
      description: The workspace where the git repo will be cloned.
    - name: cargo-home
      description: cache for cargo packages when build binaries
      optional: true
    - name: cypress-cache
      description: cache for cypress installation files when building frontend projects.
      optional: true
  tasks:
    - name: checkout
      retries: 2
      taskRef:
        name: pingcap-git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "0"
        - name: refspec
          value: $(params.git-refspec)
        - name: subdirectory
          value: $(params.component)
        - name: gitInsteadOf
          value: $(params.git-instead-of)
        - name: git-ref
          value: $(params.git-ref)
        - name: fetch-external
          value: $(params.fetch-external)
        - name: external-git-ref
          value: $(params.external-git-ref)
        - name: git-auth-app
          value: $(params.git-auth-app)
        - name: git-auth-broker-url
          value: $(params.git-auth-broker-url)
        - name: git-auth-fallback-credentials
          value: $(params.git-auth-fallback-credentials)
      workspaces:
        - name: output
          workspace: source
    - name: get-release-ver
      retries: 2
      runAfter:
        - checkout
      taskRef:
        name: pingcap-get-set-release-version
      params:
        - name: component
          value: $(params.component)
        - name: git-ref
          value: $(params.git-ref)
        - name: git-refspec
          value: $(params.git-refspec)
      workspaces:
        - name: source
          workspace: source
          subPath: $(params.component)
    - name: get-binaries-builder
      retries: 2
      taskRef:
        name: pingcap-get-builder-image
      params:
        - name: component
          value: "$(params.component)"
        - name: os
          value: "$(params.os)"
        - name: arch
          value: "$(params.arch)"
        - name: profile
          value: "$(params.profile)"
        - name: version
          value: "$(tasks.get-release-ver.results.version)"
        - name: force-builder-image
          value: "$(params.force-builder-image)"
    - name: build-binaries
      retries: 2
      taskRef:
        name: pingcap-build-binaries-linux
      params:
        - name: os
          value: "$(params.os)"
        - name: arch
          value: "$(params.arch)"
        - name: profile
          value: "$(params.profile)"
        - name: component
          value: "$(params.component)"
        - name: version
          value: "$(tasks.get-release-ver.results.version)"
        - name: git-url
          value: "$(params.git-url)"
        - name: git-ref
          value: "$(tasks.get-release-ver.results.build-ref)"
        - name: git-sha
          value: $(tasks.checkout.results.commit)
        - name: builder-image
          value: "$(tasks.get-binaries-builder.results.image-url)"
        - name: release-dir
          value: /workspace/release/$(params.component)
        - name: push
          value: "$(params.push)"
        - name: registry
          value: "$(params.registry)"
        - name: git-auth-app
          value: "$(params.git-auth-app)"
        - name: git-auth-broker-url
          value: "$(params.git-auth-broker-url)"
      workspaces:
        - name: git-credentials
          workspace: git-credentials
        - name: source
          workspace: source
        - name: cargo-home
          workspace: cargo-home
        - name: cypress-cache
          workspace: cypress-cache
    - name: build-images
      retries: 2
      when:
        - input: "$(params.push)"
          operator: in
          values: ["true"]
      taskRef:
        name: pingcap-build-images
      runAfter:
        - build-binaries
      params:
        - name: os
          value: "$(params.os)"
        - name: arch
          value: "$(params.arch)"
        - name: profile
          value: "$(params.profile)"
        - name: component
          value: "$(params.component)"
        - name: version
          value: "$(tasks.get-release-ver.results.version)"
        - name: git-url
          value: "$(params.git-url)"
        - name: git-ref
          value: "$(tasks.get-release-ver.results.build-ref)"
        - name: git-sha
          value: $(tasks.checkout.results.commit)
        - name: release-dir
          value: /workspace/release/$(params.component)
        - name: build
          value: "false"
        - name: registry
          value: "$(params.registry)"
      workspaces:
        - name: source
          workspace: source
    - name: deliver-binaries
      retries: 2
      when:
        - input: $(tasks.build-binaries.results.pushed)
          operator: notin
          values: ["{}", '"{}"']
        - input: $(params.component)
          operator: notin
          values: [tidb-cse, pd-cse, tidb-operator-cse, cassandra-on-mysql, qdrant-on-tidb]
      taskRef:
        name: pingcap-deliver-binaries
      runAfter:
        - build-binaries
      params:
        - name: src-type
          value: oci-info
        - name: src
          value: $(tasks.build-binaries.results.pushed)
        - name: publisher-url
          value: "$(params.publisher-url)"
    - name: deliver-images
      retries: 2
      when:
        - input: $(tasks.build-images.results.pushed)
          operator: notin
          values: ["{}", '"{}"']
      taskRef:
        name: pingcap-deliver-images
      runAfter:
        - build-images
      params:
        - name: src
          value: $(tasks.build-images.results.pushed)
        - name: src-type
          value: images-info
        - name: publisher-url
          value: "$(params.image-publisher-url)"

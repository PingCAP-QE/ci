# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: wait-delivery-images
spec:
  description: |
    Wait for images delivery to complete.
    This task should be run with service account with `pull-images` permission on the OCI registry.

    Request-derived parameters are passed to the scripts as environment
    variables and every expansion is quoted.
  params:
    - name: version
      type: string
      description: the version to wait for delivery.
    - name: oci-registry
      default: us-docker.pkg.dev/pingcap-testing-account/hub
      description: The OCI registry stored the origin tarball files.
    - name: delivery-config
      default: "https://cdn.jsdelivr.net/gh/PingCAP-QE/artifacts@main/packages/delivery.yaml"
      description: The delivery config yaml file, it contains delivery rules.
  steps:
    - name: compute
      image: docker.io/denoland/deno:alpine-2.1.4
      env:
        - name: VERSION
          value: "$(params.version)"
        - name: OCI_REGISTRY
          value: "$(params.oci-registry)"
        - name: DELIVERY_CONFIG
          value: "$(params.delivery-config)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        deno run --allow-all https://cdn.jsdelivr.net/gh/PingCAP-QE/artifacts@main/packages/scripts/get-delivery-target-images.ts \
          --version="${VERSION}" \
          --registry="${OCI_REGISTRY}" \
          --config="${DELIVERY_CONFIG}" \
          --save_to=/workspace/target-images.yaml
    - name: wait
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      env:
        - name: TARGET_IMAGES_FILE
          value: /workspace/target-images.yaml
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        cat "${TARGET_IMAGES_FILE}"

        while true; do
          # loop with yq for the target images file:
          check_success=true
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            echo -en "Checking $image...\t"
            if oras manifest fetch "$image" > /dev/null; then
              echo "🏅 delivery succeeded!"
            else
              echo "🤷 not found."
              check_success=false
            fi
          done < <(yq -r '.[]' "${TARGET_IMAGES_FILE}")

          if [ "$check_success" = true ]; then
            echo "🏅🏅🏅 All images delivery succeeded!"
            break
          else
            echo "❌❌❌ Some images delivery failed, retrying in 1 minute..."
            sleep 60
          fi
        done

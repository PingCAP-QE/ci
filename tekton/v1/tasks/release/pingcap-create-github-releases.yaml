# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-create-github-releases
spec:
  description: >-
    Create github releases on product GitHub repositories. The version is
    passed to the scripts as an environment variable and every expansion is
    quoted.
  params:
    - name: version
      description: the release semver tag name, e.g. v5.0.0
  workspaces:
    - name: github
      description: Must includes a key `token`
  stepTemplate:
    image: docker.io/denoland/deno:alpine-2.2.5
  steps:
    - name: create-releases
      env:
        - name: VERSION
          value: "$(params.version)"
        - name: TOKEN_FILE
          value: "$(workspaces.github.path)/token"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Pinned to an immutable commit; bump this SHA deliberately to update.
        deno run --allow-all https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@32fcc2e2ad7c326f4236a06fd91adb414e09c4d5/scripts/flow/ga/create_github_release.ts \
          --version="${VERSION}" \
          --token="$(cat "${TOKEN_FILE}")"
    - name: create-branches
      onError: continue # it's not so important.
      env:
        - name: VERSION
          value: "$(params.version)"
        - name: TOKEN_FILE
          value: "$(workspaces.github.path)/token"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Pinned to an immutable commit; bump this SHA deliberately to update.
        deno run --allow-net https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@32fcc2e2ad7c326f4236a06fd91adb414e09c4d5/scripts/flow/ga/create-patch-release-branches.ts \
          --version="${VERSION}" \
          --token="$(cat "${TOKEN_FILE}")"

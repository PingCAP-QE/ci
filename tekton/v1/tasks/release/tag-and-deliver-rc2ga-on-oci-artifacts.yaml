# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tag-and-deliver-rc2ga-on-oci-artifacts
spec:
  description: include images and non-image artifacts.
  params:
    - name: rc-version
      description: >
        the rc tag of artifacts repos, example: v1.1.1-pre
    - name: ga-version
      description: >
        the GA publish tag of artifacts repos, example: v1.1.1
    - name: registry
      default: us-docker.pkg.dev/pingcap-testing-account/hub
    - name: force
      default: "false"
      description: force to create tag whether it existed or not.
    - name: delivery-config-url
      description: URL of the delivery configuration file
      default: https://cdn.jsdelivr.net/gh/PingCAP-QE/artifacts@main/packages/delivery.yaml
    - name: generator-script-url
      description: URL of the generator script
      default: https://cdn.jsdelivr.net/gh/PingCAP-QE/artifacts@01c93d68ad2cd20d87a39ae1102f96e941234879/packages/scripts/gen-delivery-image-commands.ts
    - name: publisher-url
      description: >-
        Base URL of the TiBuild publish API, for example
        http://v2-tibuild-v2.tibuild.svc
      default: http://v2-tibuild-v2.tibuild.svc
    - name: image-publisher-url
      description: >-
        Base URL of the TiBuild publish API used for image delivery. When empty
        (or "false") the task keeps the legacy behaviour of generating a crane
        script with the deno generator and running it in this pod.
      default: ""
    - name: publish-wait-timeout-seconds
      description: How long to wait for the publication units created for the images
      default: "3600"
  steps:
    - name: add-tags
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.12.7-4-gf33384f
      args:
        - "$(params.rc-version)"
        - "$(params.ga-version)"
        - "$(params.registry)"
        - "$(params.force)"
      script: |
        #! /usr/bin/env bash
        set -ex

        rc_ver="$1"
        ga_ver="$2"
        registry="$3"
        force="$4"

        wget -c --tries=3 https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@10bcc6134c6540cb7996f7313c96d0a6eadc2683/scripts/artifacts/tag-rc2ga-on-repos.sh
        chmod +x tag-rc2ga-on-repos.sh

        ./tag-rc2ga-on-repos.sh "$rc_ver" "$ga_ver" "$registry" "$force" /workspace/results.yaml
        cat /workspace/results.yaml
    - name: deliver-binaries
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.12.7-4-gf33384f
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        publisher_url="$(params.publisher-url)/api/v2/publish/tiup/delivery-by-rules"

        deliver() {
          local artifact_url="$1"
          echo "Delivering artifact_url: $artifact_url"
          response=$(curl --fail-with-body -s -X POST "$publisher_url" \
            -H "Content-Type: application/json" \
            -d "{\"artifact_url\":\"$artifact_url\"}") || {
            echo "Failed to deliver artifact: $artifact_url"
            echo "Curl response: $response"
            exit 1
          }
          echo "Response: $response"
        }

        # use yq to loop entries of `.packages` in file /workspace/results.yaml
        yq -r '.packages[]' /workspace/results.yaml | while read -r url; do
          deliver "$url"
        done

    - name: prepare-image-refs
      when:
        - input: "$(params.image-publisher-url)"
          operator: notin
          values: ["false", ""]
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.12.7-4-gf33384f
      script: |
        #! /usr/bin/env bash
        set -euo pipefail

        # Same shape the legacy generator consumed: one entry per image, with
        # the reference split into repository and tag.
        while IFS= read -r image; do
          [[ -z "$image" ]] && continue
          printf -- "- { repo: %s, tag: %s }\n" "${image%:*}" "${image##*:}"
        done < <(yq -r '(.images // [])[]' /workspace/results.yaml) \
          > /workspace/images.yaml
        cat /workspace/images.yaml
    - name: submit-images-to-publisher
      when:
        - input: "$(params.image-publisher-url)"
          operator: notin
          values: ["false", ""]
      ref:
        name: submit-publish-images
      params:
        - name: publisher-url
          value: "$(params.image-publisher-url)"
        - name: src
          value: /workspace/images.yaml
        - name: src-type
          value: images-file
        - name: unit-ids-file
          value: /workspace/publish-unit-ids.txt
    - name: wait-for-publisher
      when:
        - input: "$(params.image-publisher-url)"
          operator: notin
          values: ["false", ""]
      ref:
        name: wait-publish-units
      params:
        - name: publisher-url
          value: "$(params.image-publisher-url)"
        - name: unit-ids-file
          value: /workspace/publish-unit-ids.txt
        - name: timeout-seconds
          value: "$(params.publish-wait-timeout-seconds)"
        - name: summary-file
          value: /workspace/publish-units.json
    - name: deliver-images
      when:
        - input: "$(params.image-publisher-url)"
          operator: in
          values: ["false", ""]
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.12.7-4-gf33384f
      env:
        - name: MAX_RETRIES
          value: "3"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # install deno
        apk add deno

        # prepare the images info file
        yq -r '.images[]' /workspace/results.yaml | awk -F: '{print "- { repo: " $1 ", tag: " $2, "}"}' | tee /workspace/images.yaml

        # prepare the delivery script
        wget -O delivery.yaml $(params.delivery-config-url)
        script="/workspace/delivery.sh"
        targetsInfo="/workspace/delivery-targets.yaml"
        deno run --allow-read --allow-write "$(params.generator-script-url)" \
          --images_file="/workspace/images.yaml" \
          --yaml_file=delivery.yaml \
          --outfile=$script \
          --images_outfile=$targetsInfo

        chmod +x $script && cat $script

        # run the delivery script
        tries=0
        until $script; do
          tries=$((tries + 1))
          if [ $tries -ge $MAX_RETRIES ]; then
            echo "Script '$script' failed after $MAX_RETRIES attempts."
            exit 1
          fi
          echo "Script '$script' failed. Retrying in 10 seconds... ($tries/$MAX_RETRIES)"
          sleep 10
        done

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: pingcap-upload-offline-package
  labels:
    app.kubernetes.io/version: "0.3"
  annotations:
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/categories: CLI
    tekton.dev/tags: cli
    tekton.dev/displayName: "aws cli"
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    This task performs upload for pingcap's offline packages. Request-derived
    parameters are passed to the script as environment variables and every
    expansion is quoted.
  params:
    - name: version
      type: string
    - name: edition
      type: string
      default: community
    - name: os
      default: linux
    - name: arch
      type: string
      default: amd64
    - name: oci-repo
      default: "us-docker.pkg.dev/pingcap-testing-account/hub/pingcap/offline-package"
    - name: dry-run
      default: "false"
  workspaces:
    - name: s3-secrets # has keys: credentials and config
  steps:
    - name: upload-offline-tarballs
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      workingDir: /workspace
      env:
        - name: VERSION
          value: "$(params.version)"
        - name: EDITION
          value: "$(params.edition)"
        - name: OS
          value: "$(params.os)"
        - name: ARCH
          value: "$(params.arch)"
        - name: OCI_REPO
          value: "$(params.oci-repo)"
        - name: DRY_RUN
          value: "$(params.dry-run)"
        - name: SECRETS_DIR
          value: "$(workspaces.s3-secrets.path)"
      script: |
        #!/usr/bin/env bash
        set -e

        apk add curl

        if [ ! -f "${SECRETS_DIR}/credentials" ]; then
          echo "Error: s3-secrets workspace is not bound."
          exit 1
        fi

        mkdir -p ~/.aws
        cat "${SECRETS_DIR}/credentials" > ~/.aws/credentials
        cat "${SECRETS_DIR}/config" > ~/.aws/config
        plugins_path="$(find /usr/lib -name site-packages -type d | head -1)"
        aws configure set plugins.cli_legacy_plugin_path "${plugins_path}"
        aws configure set plugins.endpoint awscli_plugin_endpoint

        bucket_name=$(cat "${SECRETS_DIR}/bucket_name")

        repo="${OCI_REPO}"
        dl_svr_url="http://dl.dl.svc"

        tag="${VERSION}-${EDITION}_${OS}_${ARCH}"
        echo "🚀 uploading for ${tag} ..."

        # download the files.
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          # TODO: skip it if it is uploaded remotely.

          # download from oci artifact.
          echo "🚀 Downloading $f from ${repo}:${tag} ..."
          wget -q -O "$f" "${dl_svr_url}/oci-file/${repo}?tag=${tag}&file=$f"
          echo "✅ Downloaded $f from ${repo}:${tag} ."

          # upload it.
          target_f="$(printf '%s' "$f" | sed 's/-pre//')"
          echo "🚀 Uploading $f ..."
          if [ "${DRY_RUN}" = "true" ]; then
            echo "🧪🩺 DRY run mode enabled."
            aws s3 cp "$f" "s3://${bucket_name}/fake-release/${target_f}" --acl public-read
          else
            aws s3 cp "$f" "s3://${bucket_name}/${target_f}" --acl public-read
          fi
          echo "✅ Uploaded $f ."
        done < <(curl "${dl_svr_url}/oci-files/${repo}?tag=${tag}" | jq -r '.[]')
        echo "✅ Uploaded for ${tag} ."

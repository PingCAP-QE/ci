# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-compose-offline-pkgs
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    Compose TiUP offline deploy packages. Request-derived parameters are passed
    to the step scripts as environment variables and every expansion is quoted.
  results:
    - description: Just built and pushed images, it will be a yaml content.
      name: pushed
      type: string
  params:
    - name: os
      default: linux
    - name: arch
      default: amd64
    - name: version
      type: string
      description: the version to releasing.
    - name: edition
      type: string
      default: community
      description: >
        supports: 'community' or 'enterprise'.
    - name: push
      type: string
      default: "false"
    - name: registry
      default: us-docker.pkg.dev/pingcap-testing-account/hub
    - name: tiup-mirror
      description: Product is http://tiup.pingcap.net:8987, Staging is http://tiup.pingcap.net:8988,
      default: http://tiup.pingcap.net:8988
  stepTemplate:
    image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
    env:
      - name: OUT_SCRIPT
        value: /workspace/compose-offline-packages-artifacts.sh
  steps:
    - name: generate-composing-script
      computeResources:
        requests:
          cpu: "100m"
          memory: 1Gi
      env:
        - name: OS
          value: "$(params.os)"
        - name: ARCH
          value: "$(params.arch)"
        - name: VERSION
          value: "$(params.version)"
        - name: EDITION
          value: "$(params.edition)"
        - name: TIUP_MIRROR
          value: "$(params.tiup-mirror)"
        - name: REGISTRY
          value: "$(params.registry)"
      script: |
        #!/usr/bin/env sh
        # artifacts scripts are fetched at an immutable commit; bump this SHA deliberately to update.
        git init -q /workspace/artifacts
        git -C /workspace/artifacts remote add origin https://github.com/PingCAP-QE/artifacts.git
        git -C /workspace/artifacts fetch -q --depth=1 origin 9836c414b7204cbfd8fbdaac117babaa39090910
        git -C /workspace/artifacts checkout -q --detach FETCH_HEAD

        /workspace/artifacts/packages/scripts/gen-package-offline-package-with-config.sh \
          "${OS}" \
          "${ARCH}" \
          "${VERSION}" \
          "${EDITION}" \
          /workspace/artifacts/packages/offline-packages.yaml.tmpl \
          "${OUT_SCRIPT}" \
          "${TIUP_MIRROR}" \
          "${REGISTRY}"

        if [ -f "${OUT_SCRIPT}" ]; then
          cat "${OUT_SCRIPT}"
        else
          echo "🤷 no output script generated!"
          exit 1
        fi
    - name: run
      computeResources:
        limits:
          cpu: "4"
          memory: 16Gi
      env:
        - name: TIUP_MIRROR
          value: "$(params.tiup-mirror)"
        - name: PUSH
          value: "$(params.push)"
        - name: PUSHED_RESULT
          value: "$(results.pushed.path)"
      script: |
        #! /usr/bin/env bash
        set -exo pipefail

        mkdir -vp "$HOME/.tiup/keys" "$HOME/.tiup/bin"

        # set mirror.
        tiup mirror set "${TIUP_MIRROR}" && tiup -v

        if [ "${PUSH}" = "true" ]; then
          "${OUT_SCRIPT}" -c -r -w build -p -o "${PUSHED_RESULT}"
        else
          "${OUT_SCRIPT}" -c -r -w build
          printf "%s" "null" > "${PUSHED_RESULT}"
        fi

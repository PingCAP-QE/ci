# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-build-images
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    This task builds images for pingcap components.

    ## How to run to push to google artifact registries.

    1. prepare `docker-registry` secret.
    2. append the google service account key json the to the secret.
    3. add the secret to the Kubernetes service account
    4. run the task with the service account, Tekton pipeline controller will auto inject the volume from the `docker-registry` type secret to `/tekton/creds-secrets/<secret-name>/` path.

    Request-derived parameters are passed to the step scripts as environment
    variables and every shell expansion is quoted.
  workspaces:
    - name: source
  results:
    - description: Built and pushed images, it will be a yaml content.
      name: pushed
      type: string
  params:
    - name: component
    - name: os
      default: linux
    - name: arch
      default: amd64
    - name: version
      type: string
      description: the version to releasing.
    - name: profile
      type: string
      default: release
      description: >
        supports: 'release' or 'failpoint'.
    - name: git-ref
    - name: git-sha
    - name: git-url
    - name: release-dir
      default: build
    - name: build
      default: "false"
      description: Does it need to build the binaries before packing the images?
    - name: registry
  stepTemplate:
    image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
  steps:
    - name: generate
      results:
        - name: generated
          type: string
      args: ["$(results.pushed.path)"]
      env:
        - name: COMPONENT
          value: "$(params.component)"
        - name: OS
          value: "$(params.os)"
        - name: ARCH
          value: "$(params.arch)"
        - name: VERSION
          value: "$(params.version)"
        - name: PROFILE
          value: "$(params.profile)"
        - name: GIT_REF
          value: "$(params.git-ref)"
        - name: GIT_SHA
          value: "$(params.git-sha)"
        - name: REGISTRY
          value: "$(params.registry)"
      script: |
        #!/bin/sh
        set -e
        pushed_result_path="$1"
        git clone --depth=1 --branch=main https://github.com/PingCAP-QE/artifacts.git /workspace/artifacts

        git_ref="${GIT_REF}"
        git_sha="${GIT_SHA}"
        if [ "$git_sha" = "$git_ref" ]; then
          git_sha=""
        fi

        out_script="/workspace/build-package-images.sh"
        /workspace/artifacts/packages/scripts/gen-package-images-with-config.sh \
          "${COMPONENT}" \
          "${OS}" \
          "${ARCH}" \
          "${VERSION}" \
          "${PROFILE}" \
          "${git_ref}" \
          "${git_sha}" \
          /workspace/artifacts/packages/packages.yaml.tmpl \
          "${out_script}" \
          "${REGISTRY}" || true

        if [ -f "$out_script" ]; then
          echo -n "true" > "$(step.results.generated.path)"
          cat "$out_script"
        else
          echo -n "false" > "$(step.results.generated.path)"
          echo "🤷 no output script generated!"
          printf '"{}"' > "$pushed_result_path"
        fi
    - name: build-and-publish
      image: gcr.io/kaniko-project/executor:v1.24.0-debug
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      workingDir: $(workspaces.source.path)/$(params.component)
      env:
        - name: KANIKO_EXECUTOR
          value: /kaniko/executor
        - name: CREDS_DIR
          value: /tekton/creds-secrets
        - name: GIT_URL
          value: "$(params.git-url)"
        - name: BUILD_BINARIES
          value: "$(params.build)"
        - name: RELEASE_DIR
          value: "$(params.release-dir)"
        - name: PUSHED_RESULT
          value: "$(results.pushed.path)"
      computeResources:
        requests:
          cpu: "4"
          memory: 8Gi
      script: |
        #!/bin/sh
        # The kaniko executor image is distroless: it ships /bin/sh (a busybox
        # symlink) but no /usr/bin/env, so this shebang must stay #!/bin/sh.
        # Tekton's default preamble is "#!/bin/sh" plus "set -e"; reproduce both.
        set -e
        # Prepare credentials
        DOCKER_CONFIG_JSON="$(find "$CREDS_DIR" \( -name 'docker.json' -o -name '.dockerconfigjson' \) | head -1)"
        if [ -n "$DOCKER_CONFIG_JSON" ]; then
          if [ -z "$DOCKER_CONFIG" ]; then
            export DOCKER_CONFIG=/kaniko/.docker
          fi
          # copy content to $DOCKER_CONFIG/config.json.
          mkdir -p "$DOCKER_CONFIG"
          cat "$DOCKER_CONFIG_JSON" > "$DOCKER_CONFIG/config.json"
        fi

        GSA_JSON="$(find "$CREDS_DIR" -name 'gsa.json' | head -1)"
        if [ -n "$GSA_JSON" ]; then
          export GOOGLE_APPLICATION_CREDENTIALS="$GSA_JSON"
        fi

        if [ -z "$DOCKER_CONFIG_JSON" ] && [ -z "$GSA_JSON" ]; then
          echo "❌ Error: No Docker config JSON or Google Service Account JSON found in $CREDS_DIR"
          exit 1
        fi

        # Building
        script="/workspace/build-package-images.sh"
        if [ "${BUILD_BINARIES}" = "true" ]; then
          # try 2 times.
          "$script" -w "${RELEASE_DIR}" -k "${KANIKO_EXECUTOR}" -o "${PUSHED_RESULT}" -b || \
          "$script" -w "${RELEASE_DIR}" -k "${KANIKO_EXECUTOR}" -o "${PUSHED_RESULT}" -b
        else
          # try 2 times.
          "$script" -w "${RELEASE_DIR}" -k "${KANIKO_EXECUTOR}" -o "${PUSHED_RESULT}" || \
          "$script" -w "${RELEASE_DIR}" -k "${KANIKO_EXECUTOR}" -o "${PUSHED_RESULT}"
        fi
    - name: add-more-tags
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      env:
        - name: PUSHED_RESULT
          value: "$(results.pushed.path)"
      script: |
        #!/bin/sh
        set -e
        script="/workspace/build-package-images.sh"
        oras version
        "$script" -P -t -o "${PUSHED_RESULT}" # -P means disable build and push the image.
    - name: collect-multi-arch
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      env:
        - name: PUSHED_RESULT
          value: "$(results.pushed.path)"
      script: |
        #!/bin/sh
        set -e
        script="/workspace/build-package-images.sh"
        "$script" -P -m -o "${PUSHED_RESULT}" # -P means disable build and push the image.

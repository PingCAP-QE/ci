# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-pr-to-sync-owners
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.29.0"
    tekton.dev/categories: Deno
    tekton.dev/tags: deno
    tekton.dev/displayName: "sync owners"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Create pull request to sync `OWNERS`` file to github repository branch.

    The repository url and the branch name come from a webhook, so they are
    passed to the script as environment variables, the branch name is validated
    against a strict pattern, and every expansion is quoted.
  params:
    - name: git-url
      description: repository clone url
      type: string
    - name: branch
      description: branch name
      type: string
  steps:
    - name: clone-community-repo
      image: alpine/git:v2.54.0
      workingDir: /workspace
      script: |
        git clone https://github.com/pingcap/community.git --branch master
    - name: create-pull-request
      image: denoland/deno:2.8.3
      workingDir: /workspace/community
      env:
        - name: GIT_URL
          value: "$(params.git-url)"
        - name: BRANCH
          value: "$(params.branch)"
        - name: TOKEN_FILE
          value: "$(workspaces.github.path)/token"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # The branch name is webhook-supplied: reject anything that is not a
        # plain git branch/ref name before it reaches git or deno.
        case "${BRANCH}" in
          ''|.*|*..*|*[!A-Za-z0-9._/-]*)
            echo "❌ refused malformed branch name: '${BRANCH}'" >&2
            exit 1
            ;;
        esac
        case "${BRANCH}" in
          -*) echo "❌ refused branch name starting with '-': '${BRANCH}'" >&2; exit 1 ;;
        esac

        # https://github.com/<owner>/<repo>[.git]
        owner="${GIT_URL%/*}"
        owner="${owner##*/}"
        repo="${GIT_URL##*/}"
        repo="${repo%.git}"
        case "${owner}" in
          pingcap|tikv) ;;
          *)
            echo "❌ unsupported repository owner: '${owner}'" >&2
            exit 1
            ;;
        esac

        echo "url=${GIT_URL}"
        echo "branch=${BRANCH}"
        echo "owner=${owner}"
        echo "repo=${repo}"

        if [ "${owner}" = "pingcap" ]; then
          deno run --allow-all https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@10bcc6134c6540cb7996f7313c96d0a6eadc2683/scripts/pingcap/community/update-prow-owners.ts \
            --force \
            --owner="${owner}" \
            --github_private_token="$(cat "${TOKEN_FILE}")" \
            --only_repo.repo="${repo}" \
            --only_repo.branch="${BRANCH}" \
            --inputs=teams/diagnostic/membership.json \
            --inputs=teams/docs/membership.json \
            --inputs=teams/ticdc/membership.json \
            --inputs=teams/tidb/membership.json \
            --inputs=teams/tiflash/membership.json \
            --inputs=teams/tiup/membership.json \
            --inputs=teams/kubernetes/membership.json \
            --inputs=teams/migration/membership.json \
            --inputs=teams/bigdata/membership.json
        elif [ "${owner}" = "tikv" ]; then
          deno run --allow-all https://cdn.jsdelivr.net/gh/PingCAP-QE/ci@10bcc6134c6540cb7996f7313c96d0a6eadc2683/scripts/pingcap/community/update-prow-owners.ts \
            --force \
            --owner="${owner}" \
            --github_private_token="$(cat "${TOKEN_FILE}")" \
            --only_repo.repo="${repo}" \
            --only_repo.branch="${BRANCH}" \
            --inputs=teams/pd/team.json \
            --inputs=teams/tikv/team.json
        fi
  workspaces:
    - name: github
      description: Must includes a key `token`
      mountPath: /etc/github

# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-deliver-images
  labels:
    app.kubernetes.io/version: "0.2.0"
  annotations:
    tekton.dev/pipelines.minVersion: "1.0.0"
    tekton.dev/categories: delivery
    tekton.dev/tags: images,delivery
    tekton.dev/displayName: "PingCAP product image delivery"
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    Delivers product images to the destination registries listed in the delivery
    rules. Two modes coexist: when `publisher-url` is set the task submits the
    delivery to the TiBuild publish API and waits for the per-target steps;
    otherwise it keeps the legacy behaviour of generating a `crane` script with
    the deno generator and running it in this pod.
  params:
    - name: src
    - name: src-type
      description: Type of the image parameter
      default: image-url
      enum:
        - image-url # container image url
        - images-info # yaml/json content that stored images information return by image build task
    - name: publisher-url
      description: >-
        Base URL of the TiBuild publish API, for example
        http://v2-tibuild-v2.tibuild.svc. When empty (or "false") the task falls
        back to the legacy deno generator + crane script.
      default: ""
    - name: publish-wait-timeout-seconds
      description: How long to wait for the publication units created by the publish API
      default: "1800"
    - name: delivery-config-url
      description: URL of the delivery configuration file (legacy mode only)
      default: https://cdn.jsdelivr.net/gh/PingCAP-QE/artifacts@main/packages/delivery.yaml
    - name: generator-script-url
      description: URL of the generator script (legacy mode only)
      default: https://cdn.jsdelivr.net/gh/PingCAP-QE/artifacts@main/packages/scripts/gen-delivery-image-commands.ts
    - name: retries
      description: Number of retries for image delivery step (legacy mode only)
      default: "3"
    - name: notify-webhook-url
      description: URL of the webhook for notification
      default: "http://el-notify.ee-cd.svc:8080"
  steps:
    - name: submit-to-publisher
      image: ghcr.io/pingcap-qe/cd/utils/release:v2026.7.12-4-g372cd24
      when:
        - input: "$(params.publisher-url)"
          operator: notin
          values: ["false", ""]
      results:
        - name: units
          description: Number of publication units created
          type: string
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        base="$(params.publisher-url)"
        src="$(params.src)"
        units_file="/workspace/publish-units.txt"
        : > "$units_file"

        publish() {
          local ref="$1"
          local response unit_id step_count
          echo "Submitting ${ref}"
          response="$(curl -fsS -X POST "${base}/api/v2/publish/images" \
            -H 'Content-Type: application/json' \
            -d "{\"artifactUrl\":\"${ref}\"}")"
          echo "$response"
          unit_id="$(jq -r '.id // empty' <<<"$response")"
          step_count="$(jq -r '.steps | length' <<<"$response")"
          if [[ -z "$unit_id" || "$step_count" == "0" ]]; then
            echo "  no delivery rule matched, nothing to publish"
            return 0
          fi
          echo "${unit_id}" >> "$units_file"
        }

        if [[ "$(params.src-type)" == "image-url" ]]; then
          publish "$src"
        else
          echo "$src" > /workspace/src.txt
          # Expand the build result exactly like the legacy generator did: every
          # tag of every image, de-duplicated. `yq` reads JSON as YAML.
          while IFS= read -r ref; do
            [[ -z "$ref" ]] && continue
            publish "$ref"
          done < <(yq -r '
            (if type == "!!seq" then . else .images end)[]
            | .repo as $repo
            | ([.tag] + (.tags // []) + (.multi_arch_tags // []))[]
            | select(. != null and . != "")
            | $repo + ":" + .' /workspace/src.txt | sort -u)
        fi

        echo -n "$(wc -l < "$units_file" | tr -d ' ')" > "$(step.results.units.path)"
    - name: generate
      when:
        - input: "$(params.publisher-url)"
          operator: in
          values: ["false", ""]
      image: docker.io/denoland/deno:alpine-2.0.6 # it has `wget` tool.
      results:
        - name: generated
          type: string
        - name: target
          type: string
      script: |
        #!/bin/sh
        set -e

        wget -O delivery.yaml $(params.delivery-config-url)
        script="/workspace/delivery.sh"
        targetsInfo="/workspace/delivery-targets.yaml"
        img_src="$(params.src)"
        if [ "$(params.src-type)" = "image-url" ]; then
          deno run --allow-read --allow-write "$(params.generator-script-url)" \
            --image_url="$img_src" \
            --yaml_file=delivery.yaml \
            --outfile=$script \
            --images_outfile=$targetsInfo
        elif [ "$(params.src-type)" = "images-info" ]; then
          echo "$img_src" > /workspace/src.txt
          deno run --allow-read --allow-write "$(params.generator-script-url)" \
            --images_file="/workspace/src.txt" \
            --yaml_file=delivery.yaml \
            --outfile=$script \
            --images_outfile=$targetsInfo
        fi

        if [ -f "$script" ]; then
          echo -n "true" > $(step.results.generated.path)
        else
          echo -n "false" > $(step.results.generated.path)
        fi
    - name: run
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      image: ghcr.io/pingcap-qe/cd/utils/release:v2026.7.12-4-g372cd24
      computeResources:
        requests:
          cpu: 50m
          memory: 128Mi
      script: |
        #!/bin/sh
        set -e

        script="/workspace/delivery.sh"
        tries=0
        max_retries=$(params.retries)
        until /bin/sh $script; do
          tries=$((tries + 1))
          if [ $tries -ge $max_retries ]; then
            echo "Script '$script' failed after $max_retries attempts."
            exit 1
          fi
          echo "Script '$script' failed. Retrying in 10 seconds... ($tries/$max_retries)"
          sleep 10
        done
    - name: wait-for-publisher
      image: ghcr.io/pingcap-qe/cd/utils/release:v2026.7.12-4-g372cd24
      when:
        - input: "$(params.publisher-url)"
          operator: notin
          values: ["false", ""]
      computeResources:
        requests:
          cpu: 50m
          memory: 128Mi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        base="$(params.publisher-url)"
        units_file="/workspace/publish-units.txt"
        summary_file="/workspace/publish-units.json"

        if [[ ! -s "$units_file" ]]; then
          echo "Nothing to publish: no delivery rule matched."
          echo "[]" > "$summary_file"
          exit 0
        fi

        rm -f /workspace/publish-unit-*.json
        deadline=$(( $(date +%s) + $(params.publish-wait-timeout-seconds) ))
        interval=10
        while :; do
          pending=0
          failed=0
          index=0
          while IFS= read -r unit_id; do
            [[ -z "$unit_id" ]] && continue
            index=$((index + 1))
            body="$(curl -fsS "${base}/api/v2/publish/units/${unit_id}")" || {
              echo "Failed to read publication unit ${unit_id}" >&2
              exit 1
            }
            printf '%s' "$body" > "/workspace/publish-unit-${index}.json"
            state="$(jq -r '.state' <<<"$body")"
            echo "Unit ${unit_id}: ${state}"
            jq -r '.steps[] | "  - \(.target)\t\(.state)\t\(.dest // "")"' <<<"$body"
            case "$state" in
              succeeded) ;;
              queued|running) pending=1 ;;
              *) failed=1 ;;
            esac
          done < "$units_file"

          if [[ "$failed" == "1" ]]; then
            jq -s '.' /workspace/publish-unit-*.json > "$summary_file" || true
            echo "Publication did not fully succeed; see the unit states above." >&2
            exit 1
          fi
          if [[ "$pending" == "0" ]]; then
            jq -s '.' /workspace/publish-unit-*.json > "$summary_file"
            echo "All targets delivered."
            exit 0
          fi
          if [[ "$(date +%s)" -ge "$deadline" ]]; then
            echo "Timed out after $(params.publish-wait-timeout-seconds)s waiting for the publication." >&2
            exit 1
          fi
          sleep "$interval"
          interval=$(( interval < 30 ? interval + 10 : 30 ))
        done
    - name: post-notify
      image: ghcr.io/pingcap-qe/cd/utils/release:v2026.7.12-4-g372cd24
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
        - input: "$(params.notify-webhook-url)"
          operator: notin
          values: ["false", ""]
      script: |
        #!/usr/bin/env bash
        set -e

        # prepare event data
        targetsInfo="/workspace/delivery-targets.yaml" # output from the previous steps
        yq --output-format json . "$targetsInfo" | tee event.json

        # send cloud-events to tekton event listener
        curl -X POST "$(params.notify-webhook-url)" \
        -H "Content-Type: application/cloudevents+json" \
        -H "ce-specversion: 1.0" \
        -H "ce-id: $(uuidgen)" \
        -H "ce-type: net.pingcap.tibuild.notify.delivery.images.success" \
        -H "ce-source: tekton/taskRun/$(context.taskRun.name)" \
        --data-binary @event.json
    - name: post-notify-publisher
      image: ghcr.io/pingcap-qe/cd/utils/release:v2026.7.12-4-g372cd24
      when:
        - input: "$(params.publisher-url)"
          operator: notin
          values: ["false", ""]
        - input: "$(params.notify-webhook-url)"
          operator: notin
          values: ["false", ""]
      script: |
        #!/usr/bin/env bash
        set -e

        # The event data is the summary of the publication units that just
        # finished, so downstream consumers can see per-target results.
        unitsFile="/workspace/publish-units.json"
        if [ ! -f "$unitsFile" ]; then
          echo "[]" > "$unitsFile"
        fi
        cat "$unitsFile"

        curl -X POST "$(params.notify-webhook-url)" \
        -H "Content-Type: application/cloudevents+json" \
        -H "ce-specversion: 1.0" \
        -H "ce-id: $(uuidgen)" \
        -H "ce-type: net.pingcap.tibuild.notify.delivery.images.success" \
        -H "ce-source: tekton/taskRun/$(context.taskRun.name)" \
        --data-binary @"$unitsFile"

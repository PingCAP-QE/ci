# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-deliver-binaries
  labels:
    app.kubernetes.io/version: "0.2.0"
  annotations:
    tekton.dev/pipelines.minVersion: "1.0.0"
    tekton.dev/categories: delivery
    tekton.dev/tags: binaries,delivery,oci
    tekton.dev/displayName: "PingCAP product binaries delivery"
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  params:
    - name: src
    - name: src-type
      description: Type of the binaries parameter
      default: oci-url
      enum:
        - oci-url # oci url
        - oci-info # yaml/json content that stored oci information return by binaries build task
    - name: publisher-url
      description: >-
        Base URL of the TiBuild publish API, for example
        http://v2-tibuild-v2.tibuild.svc. Empty or "false" skips delivery.
    - name: notify-webhook-url
      description: URL of the webhook for notification
      default: "http://el-harbor:8080"
  stepTemplate:
    image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.26-7-geb77a69
    computeResources:
      requests:
        cpu: 50m
        memory: 128Mi
  steps:
    - name: notify-tiup-publisher
      when:
        - input: "$(params.publisher-url)"
          operator: notin
          values: ["false", ""]
      env:
        - name: SRC
          value: "$(params.src)"
        - name: SRC_TYPE
          value: "$(params.src-type)"
        - name: PUBLISHER_URL
          value: "$(params.publisher-url)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        targetsInfo="/workspace/delivery-targets.yaml"
        oci_src="${SRC}"
        publisher_url="${PUBLISHER_URL}/api/v2/publish/tiup/delivery-by-rules"

        deliver() {
          local artifact_url="$1" body_file
          echo "Delivering artifact_url: $artifact_url"
          body_file="$(mktemp)"
          jq -n --arg artifact_url "$artifact_url" \
            '{artifact_url: $artifact_url}' > "$body_file"
          response=$(curl -s -X POST "$publisher_url" \
            -H "Content-Type: application/json" \
            -d "@$body_file")
          rm -f "$body_file"
          echo "Response: $response"
        }

        if [ "${SRC_TYPE}" = "oci-url" ]; then
          deliver "$oci_src"
        elif [ "${SRC_TYPE}" = "oci-info" ]; then
          printf '%s' "$oci_src" > /workspace/src.txt
          repo="$(yq .oci.repo /workspace/src.txt)"
          # loop tags in .oci.tags
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            deliver "$repo:$tag"
          done < <(yq -r '.oci.tags[]' /workspace/src.txt)
        fi
    - name: notify-to-build-ctl-component
      when:
        - input: "$(params.src-type)"
          operator: in
          values: ["oci-info"]
        - input: "$(params.notify-webhook-url)"
          operator: notin
          values: ["false", ""]
      env:
        - name: SRC
          value: "$(params.src)"
        - name: NOTIFY_WEBHOOK_URL
          value: "$(params.notify-webhook-url)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        oci_src="${SRC}"
        notify_webhook_url="${NOTIFY_WEBHOOK_URL}"

        # Write the OCI source to a file for processing
        printf '%s' "$oci_src" > /workspace/src.txt

        # Extract repository and tags
        repo="$(yq .oci.repo /workspace/src.txt)"
        resource_url="$(yq .oci.repo /workspace/src.txt)"

        # Loop through each tag and send a notification
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          # Construct the event data
          event_data=$(jq -n \
            --arg repo_full_name "${repo#*/}" \
            --arg tag "$tag" \
            --arg resource_url "$resource_url" \
            '{
              type: "PUSH_ARTIFACT",
              event_data: {
                repository: {repo_full_name: $repo_full_name},
                resources: [{tag: $tag, resource_url: $resource_url}]
              }
            }')

          # Send the event to the webhook
          echo "Sending event for tag: $tag"
          echo -e "event data:\n$event_data"
          response=$(curl -s -X POST "$notify_webhook_url" \
            -H "Content-Type: application/json" \
            -d "$event_data")
          echo "Response: $response"
        done < <(yq -r '.oci.tags[]' /workspace/src.txt)

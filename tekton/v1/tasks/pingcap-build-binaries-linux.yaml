apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-build-binaries-linux
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    Build binaries for the component.

    Request-derived values are mapped to environment variables instead of being
    interpolated into the step scripts, and every shell expansion is quoted.
    Which builder images are acceptable is a product policy decided where the
    request enters the system (the devbuild API), not here: this Task receives
    both the pinned image from the artifacts config and a user-overridden one
    through the same param, so it cannot tell them apart by value.
  workspaces:
    - name: git-credentials
      optional: true
      description: Runtime GitHub basic-auth secret for private Go and Cargo dependencies.
    - name: source
      description: source code.
    - name: cargo-home
      description: Cache for cargo packages.
      mountPath: /workspace/.cargo
      optional: true
    - name: cypress-cache
      description: Cache for cypress installation files.
      mountPath: /workspace/.cache/Cypress
      optional: true
  results:
    - description: Just built and pushed artifacts, it will be a yaml content.
      name: pushed
  params:
    - name: component
    - name: os
      default: linux
    - name: arch
      default: amd64
    - name: version
      type: string
      description: the version to releasing.
    - name: profile
      type: string
      default: release
      description: >
        supports: 'release' or 'failpoint'.
    - name: git-ref
    - name: git-sha
    - name: git-url
    - name: builder-image
      default: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      description: >-
        Builder image for the build step, normally the image pinned by the
        artifacts config for the component. Values supplied by a caller are
        vetted by the devbuild API, the place where the request enters the
        system.
    - name: release-dir
      default: build
    - name: push
      type: string
      default: "false"
    - name: registry
    - name: git-auth-app
      description: >-
        Authenticate git with GitHub App installation tokens minted by the
        in-cluster token broker, so the build pod needs no PAT for private Go
        and Cargo dependencies. Set to "false" to use the legacy
        git-credentials workspace.
      type: string
      default: "true"
    - name: git-auth-broker-url
      description: Base URL of the in-cluster token broker.
      type: string
      default: "http://github-token-broker.github-token-broker.svc"
    - name: git-auth-home
      description: >-
        Shared home directory of the pod where the credential helper is
        installed. Tekton mounts it in every step, but steps keep the HOME of
        their own image, so the path must be absolute.
      type: string
      default: "/tekton/home"
    - name: git-auth-permissions
      description: Permissions requested from the broker, as name=level pairs separated by semicolons.
      type: string
      default: "contents=read"
  steps:
    - name: setup-git-auth
      when:
        - input: "$(params.git-auth-app)"
          operator: in
          values: ["true"]
      ref:
        name: setup-git-auth
      params:
        - name: broker-url
          value: "$(params.git-auth-broker-url)"
        - name: permissions
          value: "$(params.git-auth-permissions)"
        - name: user-home
          value: "$(params.git-auth-home)"

    - name: generate
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      results:
        - name: generated
          type: string
      args: ["$(results.pushed.path)"]
      env:
        - name: COMPONENT
          value: "$(params.component)"
        - name: OS
          value: "$(params.os)"
        - name: ARCH
          value: "$(params.arch)"
        - name: VERSION
          value: "$(params.version)"
        - name: PROFILE
          value: "$(params.profile)"
        - name: GIT_REF
          value: "$(params.git-ref)"
        - name: GIT_SHA
          value: "$(params.git-sha)"
        - name: REGISTRY
          value: "$(params.registry)"
      script: |
        #!/usr/bin/env sh
        pushed_result_path="$1"
        git clone --depth=1 --branch=main https://github.com/PingCAP-QE/artifacts.git /workspace/artifacts

        git_ref="${GIT_REF}"
        git_sha="${GIT_SHA}"
        if [ "$git_sha" = "$git_ref" ]; then
          git_sha=""
        fi

        out_script="/workspace/build-package-artifacts.sh"
        /workspace/artifacts/packages/scripts/gen-package-artifacts-with-config.sh \
          "${COMPONENT}" \
          "${OS}" \
          "${ARCH}" \
          "${VERSION}" \
          "${PROFILE}" \
          "${git_ref}" \
          "${git_sha}" \
          /workspace/artifacts/packages/packages.yaml.tmpl \
          "${out_script}" \
          "${REGISTRY}"

        if [ -f "$out_script" ]; then
          echo -n "true" > "$(step.results.generated.path)"
          cat "$out_script"
        else
          echo -n "false" > "$(step.results.generated.path)"
          echo "🤷 no output script generated!"
          printf '"{}"' > "$pushed_result_path"
        fi
    - name: build
      image: "$(params.builder-image)"
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      workingDir: $(workspaces.source.path)/$(params.component)
      env:
        - name: CARGO_NET_GIT_FETCH_WITH_CLI
          value: "true"
        - name: GIT_SSH_COMMAND
          value: "ssh -o StrictHostKeyChecking=no"
        # Fail fast instead of prompting when no credential helper can answer.
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        # Go and Cargo resolve private modules through the git credential helper.
        - name: GOPRIVATE
          value: "github.com/tidbcloud/*,github.com/pingcap-inc/*"
        - name: GIT_AUTH_APP
          value: "$(params.git-auth-app)"
        - name: GIT_AUTH_HOME
          value: "$(params.git-auth-home)"
        - name: GIT_REF
          value: "$(params.git-ref)"
        - name: RELEASE_DIR
          value: "$(params.release-dir)"
        # - name: RUSTUP_DIST_SERVER
        #   value: https://rsproxy.cn
        # - name: RUSTUP_UPDATE_ROOT
        #   value: https://rsproxy.cn/rustup
        # - name: GOPROXY
        # - name: CARGO_HOME
        #   value: /workspace/.cargo
        # - name: NPM_CONFIG_REGISTRY
        #   value: https://registry.npmmirror.com
        # - name: CYPRESS_CACHE_FOLDER
        #   value: /workspace/.cache/Cypress
      script: |
        # With git-auth-app the broker helper replaces the PAT workspace, so the
        # build pod holds no long-lived GitHub credential. The workspace branch
        # stays as the rollback path.
        if [ "${GIT_AUTH_APP}" != "true" ] && [ "$(workspaces.git-credentials.bound)" = "true" ]; then
          set -eu
          export GIT_BRANCH="${GIT_REF:-}"
          export GOPRIVATE=github.com/tidbcloud/*,github.com/pingcap-inc/*
          export GIT_TERMINAL_PROMPT=0
          credential_dir="$(workspaces.git-credentials.path)"
          test -s "$credential_dir/username" && test -s "$credential_dir/password"
          export SERVERLESS_GIT_CREDENTIAL_DIR="$credential_dir"
          cat > /workspace/serverless-git-credential <<'HELPER'
        #!/bin/sh
        [ "$1" = get ] || exit 0
        printf 'username=%s\n' "$(cat "$SERVERLESS_GIT_CREDENTIAL_DIR/username")"
        printf 'password=%s\n' "$(cat "$SERVERLESS_GIT_CREDENTIAL_DIR/password")"
        HELPER
          chmod 700 /workspace/serverless-git-credential
          # Bullseye builders use Git 2.30, before GIT_CONFIG_COUNT support.
          # The config contains only a helper path; secrets stay in the mount.
          mkdir -p "$HOME"
          cat >> "$HOME/.gitconfig" <<'CONFIG'
        [credential "https://github.com"]
          helper =
          helper = /workspace/serverless-git-credential
        [url "https://github.com/"]
          insteadOf = git@github.com:
          insteadOf = ssh://git@github.com/
        CONFIG
        fi
        # The setup step installs the helper in the shared home; this step keeps
        # the HOME of the builder image, so read the fragment by absolute path.
        git_auth_fragment="${GIT_AUTH_HOME}/.git-auth/gitconfig.fragment"
        if [ -f "${git_auth_fragment}" ]; then
          mkdir -p "$HOME"
          cat "${git_auth_fragment}" >> "$HOME/.gitconfig"
        fi
        script="/workspace/build-package-artifacts.sh"
        "$script" -b -a -w "${RELEASE_DIR}"
    - name: publish
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      workingDir: $(workspaces.source.path)/$(params.component)
      env:
        - name: GIT_URL
          value: "$(params.git-url)"
        - name: RELEASE_DIR
          value: "$(params.release-dir)"
        - name: PUSHED_RESULT
          value: "$(results.pushed.path)"
      script: |
        #!/usr/bin/env sh
        script="/workspace/build-package-artifacts.sh"

        # Read-only listing of the produced archives. No extraction happens here.
        find "${RELEASE_DIR}" -name "*.tar.gz" -type f | while IFS= read -r f; do
          tar -tf "$f"
        done

        oras version
        # try 2 times.
        "$script" -p -w "${RELEASE_DIR}" -o "${PUSHED_RESULT}" || \
        "$script" -p -w "${RELEASE_DIR}" -o "${PUSHED_RESULT}"

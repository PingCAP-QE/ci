apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-build-binaries-linux
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    Build binaries for the component.
  workspaces:
    - name: git-credentials
      optional: true
      description: Runtime GitHub basic-auth secret for private Go and Cargo dependencies.
    - name: source
      description: source code.
    - name: cargo-home
      description: Cache for cargo packages.
      mountPath: /workspace/.cargo
      optional: true
    - name: cypress-cache
      description: Cache for cypress installation files.
      mountPath: /workspace/.cache/Cypress
      optional: true
  results:
    - description: Just built and pushed artifacts, it will be a yaml content.
      name: pushed
  params:
    - name: artifacts-revision
      default: main
      description: Artifacts configuration revision; pin to a commit during validation.
    - name: require-artifacts
      default: "false"
    - name: component
    - name: os
      default: linux
    - name: arch
      default: amd64
    - name: version
      type: string
      description: the version to releasing.
    - name: profile
      type: string
      default: release
      description: >
        supports: 'release' or 'failpoint'.
    - name: git-ref
    - name: git-sha
    - name: git-url
    - name: builder-image
      default: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
    - name: release-dir
      default: build
    - name: push
      type: string
      default: "false"
    - name: registry
  steps:
    - name: generate
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      results:
        - name: generated
          type: string
      args: ["$(results.pushed.path)"]
      script: |
        pushed_result_path="$1"
        git init /workspace/artifacts
        git -C /workspace/artifacts remote add origin https://github.com/PingCAP-QE/artifacts.git
        git -C /workspace/artifacts fetch --depth=1 origin "$(params.artifacts-revision)"
        git -C /workspace/artifacts checkout --detach FETCH_HEAD

        git_ref="$(params.git-ref)"
        git_sha="$(params.git-sha)"
        if [ "$git_sha" == "$git_ref" ]; then
          git_sha=""
        fi

        out_script="/workspace/build-package-artifacts.sh"
        /workspace/artifacts/packages/scripts/gen-package-artifacts-with-config.sh \
          $(params.component) \
          $(params.os) \
          $(params.arch) \
          $(params.version) \
          $(params.profile) \
          $git_ref \
          "$git_sha" \
          /workspace/artifacts/packages/packages.yaml.tmpl \
          "$out_script" \
          $(params.registry)

        if [ -f "$out_script" ]; then
          echo -n "true" > $(step.results.generated.path)
          cat "$out_script"
        else
          echo -n "false" > $(step.results.generated.path)
          echo "🤷 no output script generated!"
          [ "$(params.require-artifacts)" != "true" ] || exit 1
          printf '"{}"' > "$pushed_result_path"
        fi
    - name: build
      image: "$(params.builder-image)"
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      workingDir: $(workspaces.source.path)/$(params.component)
      env:
        - name: GIT_BRANCH
          value: $(params.git-ref)
        - name: GOPRIVATE
          value: github.com/tidbcloud/*,github.com/pingcap-inc/*
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        - name: CARGO_NET_GIT_FETCH_WITH_CLI
          value: "true"
        - name: GIT_SSH_COMMAND
          value: "ssh -o StrictHostKeyChecking=no"
        # - name: RUSTUP_DIST_SERVER
        #   value: https://rsproxy.cn
        # - name: RUSTUP_UPDATE_ROOT
        #   value: https://rsproxy.cn/rustup
        # - name: GOPROXY
        # - name: CARGO_HOME
        #   value: /workspace/.cargo
        # - name: NPM_CONFIG_REGISTRY
        #   value: https://registry.npmmirror.com
        # - name: CYPRESS_CACHE_FOLDER
        #   value: /workspace/.cache/Cypress
      script: |
        set -eu
        if [ "$(workspaces.git-credentials.bound)" = "true" ]; then
          credential_dir="$(workspaces.git-credentials.path)"
          test -s "$credential_dir/username" && test -s "$credential_dir/password"
          export SERVERLESS_GIT_CREDENTIAL_DIR="$credential_dir"
          cat > /workspace/serverless-git-credential <<'HELPER'
        #!/bin/sh
        [ "$1" = get ] || exit 0
        printf 'username=%s\n' "$(cat "$SERVERLESS_GIT_CREDENTIAL_DIR/username")"
        printf 'password=%s\n' "$(cat "$SERVERLESS_GIT_CREDENTIAL_DIR/password")"
        HELPER
          chmod 700 /workspace/serverless-git-credential
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper
          export GIT_CONFIG_VALUE_0=/workspace/serverless-git-credential
          export GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf
          export GIT_CONFIG_VALUE_1=git@github.com:
        fi
        script="/workspace/build-package-artifacts.sh"
        "$script" -b -a -w "$(params.release-dir)"
    - name: publish
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      when:
        - input: "$(steps.generate.results.generated)"
          operator: in
          values: ["true"]
      workingDir: $(workspaces.source.path)/$(params.component)
      env:
        - name: GIT_URL
          value: $(params.git-url)
      script: |
        script="/workspace/build-package-artifacts.sh"

        for f in $(find $(params.release-dir) -name "*.tar.gz"); do
          tar -tf $f
        done

        oras version
        # try 2 times.
        "$script" -p -w "$(params.release-dir)" -o $(results.pushed.path) || \
        "$script" -p -w "$(params.release-dir)" -o $(results.pushed.path)
        if [ "$(params.require-artifacts)" = "true" ]; then
          yq -e '.oci.repo != null and .oci.digest != null and (.files | length > 0)'  $(results.pushed.path) >/dev/null
        fi

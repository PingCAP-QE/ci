# yaml-language-server: $schema=https://github.com/redhat-developer/vscode-tekton/raw/refs/heads/main/scheme/tekton.dev/v1_Task.json
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: pingcap-get-builder-image
  labels:
    app.kubernetes.io/version: "0.3"
  annotations:
    tekton.dev/platforms: "linux/amd64,linux/arm64"
spec:
  description: >-
    Resolve the builder image for a component.

    The image is either taken from the pinned artifacts config or forced by the
    caller through an untrusted CloudEvent header (`ce-paramBuilderImage`).
    Which images a caller may force is a product policy decided where the
    request enters the system (the devbuild API). Here the value only has to be
    a well-formed single-line image reference, because it becomes the `image:`
    of a later build step.
  results:
    - description: The builder image url
      name: image-url
      type: string
  params:
    - name: component
      type: string
    - name: os
      default: linux
    - name: arch
      default: amd64
    - name: version
      type: string
      description: the version to releasing.
    - name: profile
      type: string
      default: release
      description: >
        supports: 'release' or 'failpoint' or others.
    - name: force-builder-image
      type: string
      description: >
        force to use a specific builder image, it will be used as the base
        image for building binaries. The value must be a well-formed image
        reference; whether the caller is allowed to force it is vetted by the
        devbuild API.
      default: ""
  steps:
    - name: get
      image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.12-7-gfdd779c
      env:
        - name: COMPONENT
          value: "$(params.component)"
        - name: OS
          value: "$(params.os)"
        - name: ARCH
          value: "$(params.arch)"
        - name: VERSION
          value: "$(params.version)"
        - name: PROFILE
          value: "$(params.profile)"
        - name: FORCE_BUILDER_IMAGE
          value: "$(params.force-builder-image)"
        - name: IMAGE_URL_RESULT
          value: "$(results.image-url.path)"
      script: |
        #!/bin/sh
        set -eu

        # `force-builder-image` comes from an untrusted CloudEvent header
        # (ce-paramBuilderImage) and ends up as the `image:` of a later build
        # step, so it must be a single-line, well-formed image reference. Which
        # images are allowed is decided by the devbuild API, where the request
        # enters the system; a value allowlist here would have to be updated for
        # every builder image the artifacts config pins.
        is_valid_image_reference() {
          case "${1}" in
            ''|[!A-Za-z0-9]*|*[!A-Za-z0-9._:/@-]*) return 1 ;;
            *) return 0 ;;
          esac
        }

        if [ -n "${FORCE_BUILDER_IMAGE}" ]; then
          if ! is_valid_image_reference "${FORCE_BUILDER_IMAGE}"; then
            echo "❌ malformed forced builder image: '${FORCE_BUILDER_IMAGE}'" >&2
            exit 1
          fi
          echo "use force builder image: ${FORCE_BUILDER_IMAGE}"
          printf '%s' "${FORCE_BUILDER_IMAGE}" > "${IMAGE_URL_RESULT}"
          exit 0
        fi

        git clone --depth=1 --branch=main https://github.com/PingCAP-QE/artifacts.git /workspace/artifacts

        out="/workspace/builder-package-artifacts.txt"
        /workspace/artifacts/packages/scripts/get-package-builder-with-config.sh \
          "${COMPONENT}" \
          "${OS}" \
          "${ARCH}" \
          "${VERSION}" \
          "${PROFILE}" \
          /workspace/artifacts/packages/packages.yaml.tmpl \
          "${out}"

        resolved_image=""
        if [ -f "${out}" ]; then
          resolved_image="$(cat "${out}")"
        fi
        # The resolved image comes from the pinned artifacts config; only the
        # reference shape is checked, because it becomes a step `image:`.
        if ! is_valid_image_reference "${resolved_image}"; then
          echo "❌ malformed resolved builder image: '${resolved_image}'" >&2
          exit 1
        fi
        printf '%s' "${resolved_image}" > "${IMAGE_URL_RESULT}"

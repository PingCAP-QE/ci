apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: git-push-pingcap-tidb-build-rust
  labels:
    type: github-branch-push
    github-owner: pingcap
    github-repo: tidb
    profile: rust
spec:
  interceptors:
    - name: filter on repo owner and name and branches
      ref: { name: cel }
      params:
        - name: filter
          # support branches:
          # - hparser-integration (the Rust SQL-node rewrite branch)
          #
          # The build profile is `rust`: it builds only the standalone Rust
          # tidb-server (linux amd64/arm64) and publishes the `tidb` tiup
          # package to the staging mirror. No container images are built.
          value: >-
            body.repository.full_name == 'pingcap/tidb'
            &&
            body.ref.matches('^refs/heads/hparser-integration$')

  bindings:
    - ref: github-branch-push
    - ref: gcp-classic-build-params
    - { name: component, value: tidb }
    - { name: os, value: linux }
    - { name: profile, value: rust }
    # The checkout task always fetches the enterprise-plugin repo (`fetch-external`
    # is hard-coded true in the pipeline). The rust branch does not use the plugin,
    # and `hparser-integration` does not exist in `pingcap-inc/enterprise-plugin`,
    # so pin the external ref to `master` to bypass the branch resolution.
    - { name: external-git-ref, value: master }
    - { name: timeout, value: 60m }
    - { name: source-ws-size, value: 50Gi }
    - { name: builder-resources-memory, value: 32Gi }
    - { name: builder-resources-cpu, value: "8" }
  template:
    ref: build-component-linux

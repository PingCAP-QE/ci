apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: tag-create-pingcap-tiproxy-darwin-arm64
  labels:
    type: github-tag-create
    github-owner: pingcap
    github-repo: tiproxy
spec:
  interceptors:
    # Verify the GitHub webhook HMAC before trusting any payload field; see
    # "Security model" in tekton/v1/triggers/README.md.
    - name: verify github webhook signature
      ref: { name: github }
      params:
        - name: secretRef
          value:
            secretName: el-github-webhook
            secretKey: secret
    - name: filter on repo owner and name and tags
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            body.repository.full_name == 'pingcap/tiproxy'
            &&
            body.ref.matches('^v[0-9]+[.][0-9]+[.][0-9]+(-(alpha|beta)([.][0-9]+.*)?)?$')
  bindings:
    - ref: github-tag-create
    - ref: gcp-classic-build-params
    - { name: component, value: $(body.repository.name) }
    - { name: profile, value: release }
    - { name: os, value: darwin }
    - { name: arch, value: arm64 }
    - { name: timeout, value: 30m }
  template:
    ref: build-component-darwin-mac

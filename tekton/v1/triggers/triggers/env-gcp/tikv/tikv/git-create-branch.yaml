apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: branch-create-tikv-tikv
  labels:
    type: github-branch-create
    github-owner: tikv
    github-repo: tikv
spec:
  interceptors:
    # Verify the GitHub webhook HMAC before trusting any payload field; see
    # "Security model" in tekton/v1/triggers/README.md.
    - name: verify github webhook signature
      ref: { name: github }
      params:
        - name: secretRef
          value:
            secretName: el-github-webhook
            secretKey: secret
    - name: filter on repo owner and name and branches
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            body.repository.owner.login == 'tikv'
            &&
            body.repository.name == 'tikv'
            &&
            body.ref.matches('^release-[0-9]+[.][0-9]+(-beta[.][0-9]+)?$')
  bindings:
    - ref: github-branch-create
  template:
    ref: bump-tikv-cargo-pkg-version

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: branch-create-pingcap-org-bump-placeholder-ng
  labels:
    type: github-branch-create
    github-owner: pingcap
spec:
  interceptors:
    # Verify the GitHub webhook HMAC before trusting any payload field; see
    # "Security model" in tekton/v1/triggers/README.md.
    - name: verify github webhook signature
      ref: { name: github }
      params:
        - name: secretRef
          value:
            secretName: el-github-webhook
            secretKey: secret
    - name: filter on repo owner and name and branches
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            body.repository.full_name in [
            'pingcap/ticdc',
            'pingcap/tidb',
            'pingcap/tiflash',
            'pingcap/tiflow',
            'pingcap/tiproxy',
            'tidbcloud/cloud-storage-engine',
            'tikv/pd',
            ]
            &&
            body.ref.matches('^(release-nextgen-[0-9]+|release-nextgen-[0-9]+[.][0-9]+[.][0-9]+-[0-9]{8})$')
  bindings:
    - ref: github-branch-create
  template:
    ref: bump-placeholder-version-in-readme

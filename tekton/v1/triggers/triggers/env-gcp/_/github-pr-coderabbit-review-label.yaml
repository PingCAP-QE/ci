apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: github-pr-coderabbit-review-label
  labels:
    type: github-pr-review
spec:
  interceptors:
    - name: filter rollout repositories and review events
      ref: { name: cel }
      params:
        - name: filter
          # Keep the pilot branch; production repositories rely on CodeRabbit's branch configuration.
          # Add production repositories to the list below.
          value: >-
            (
              (
                body.repository.full_name == 'ti-community-infra/configs'
                && body.pull_request.base.ref == 'test_ai_review'
              )
              || body.repository.full_name in [
                'pingcap/tiflash',
                'tikv/pd'
              ]
            )
            && header.match('X-GitHub-Event', 'pull_request_review')
            && body.action in ['submitted', 'dismissed']
            && body.review.user.login == 'coderabbitai[bot]'
            && body.review.user.type == 'Bot'
  bindings:
    - ref: github-pr
  template:
    ref: coderabbit-review-label

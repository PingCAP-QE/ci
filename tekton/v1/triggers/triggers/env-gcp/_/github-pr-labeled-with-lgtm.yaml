apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: pr-to-feature-branches-labeled-with-lgtm
  labels:
    type: github-pr
spec:
  interceptors:
    - name: filter on repo owner and name and tags
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            (
              (body.action == 'labeled' && body.label.name in ['lgtm'])
              ||
              (body.action == 'unlabeled' && body.label.name in ['approved'])
            )
            &&
            body.repository.full_name in [
              'pingcap/tidb',
              'pingcap/tiflash',
              'pingcap/tiflow',
              'pingcap/ticdc',
              'tikv/tikv',
              'tikv/pd',
            ]
            &&
            body.pull_request.base.ref.startsWith('feature/')
  bindings:
    - ref: github-pr
  template:
    spec:
      params:
        - name: pr-owner
        - name: pr-repo
        - name: pr-number
      resourcetemplates:
        - apiVersion: tekton.dev/v1
          kind: TaskRun
          metadata:
            generateName: auto-add-approved-label-to-pr-on-special-branch-
          spec:
            params:
              - name: owner
                value: $(tt.params.pr-owner)
              - name: repo
                value: $(tt.params.pr-repo)
              - name: number
                value: $(tt.params.pr-number)
            taskSpec:
              description: CI helper for contribution pull requests
              params:
                - name: owner
                  description: repo owner
                - name: repo
                  description: repo short name
                - name: number
                  description: pull request number
              steps:
                - name: edit-pull-request
                  image: ghcr.io/pingcap-qe/cd/utils/release:v2025.10.26-7-geb77a69
                  script: |
                    #!/usr/bin/env bash
                    set -eo pipefail

                    export GH_TOKEN="$(cat $(workspaces.github.path)/token)"
                    pr_url="https://github.com/$(params.owner)/$(params.repo)/pull/$(params.number)"

                    if ! gh pr view "$pr_url" --json labels --jq '.labels[].name' | grep -E '^lgtm$'; then
                      echo "🚫 there is no 'lgtm' label on the PR."
                      exit 0
                    fi

                    # Feature branches are merged on `lgtm` alone, so this job turns
                    # `lgtm` into the `approved` that tide wants. That is only sound
                    # when the label came from Prow's lgtm plugin, which labels a
                    # PR after an OWNER/reviewer comments `/lgtm`. Anyone with write
                    # access can add the label by hand, so check who applied it
                    # before granting approval.
                    lgtm_actor=$(gh api \
                      "repos/$(params.owner)/$(params.repo)/issues/$(params.number)/timeline" \
                      --paginate \
                      --jq '[.[] | select(.event == "labeled" and .label.name == "lgtm") | .actor.login] | last // ""')
                    if [ "$lgtm_actor" != "ti-chi-bot" ]; then
                      echo "🚫 refusing to approve: the 'lgtm' label was applied by '${lgtm_actor:-unknown}', not by Prow's lgtm plugin."
                      exit 0
                    fi

                    gh pr edit --add-label approved "$pr_url"

              workspaces:
                - name: github
                  description: Must includes a key `token`
            workspaces:
              - name: github
                secret:
                  secretName: github

# Community darwin builds on GCP via macbuild (MacBuild custom task).
#
# Migrated from env-prod2 (`_/git-push-branch-build-community-darwin.yaml`),
# which ran them on KSY through boskos + SSH (`build-component-darwin`).
# prod2's Tekton is being retired, and macOS targets move to the gcp mac
# workers (mac-builder-operator). Mirrors the repo/branch filters and resource
# overlays of the prod2 triggers; only the binding set and the template differ.
#
# NOTE (dependency): `PingCAP-QE/artifacts` removes tiflow's inline nvm/node
# install only *after* this trigger is deployed — the declarative `macos.tools`
# toolchain is provided by the mac agent on this (gcp/macbuild) path.
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: github-push-build-community-darwin
  labels:
    type: github-branch-push
    profile: community
spec:
  interceptors:
    - name: filter on repo and branch
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            (
              body.repository.full_name in [
                'pingcap/monitoring',
                'pingcap/ng-monitoring',
                'pingcap/ticdc',
                'pingcap/tidb',
                'pingcap/tidb-dashboard',
                'pingcap/tiflash',
                'pingcap/tiflow',
                'tikv/pd',
                'tikv/tikv',
              ]
              &&
              body.ref.matches('^refs/heads/(main|master|release-[6-9][.][0-9]+(-beta[.][0-9]+)?)$')
            ) || (
              body.repository.full_name in [ 'pingcap/tiproxy' ]
              &&
              body.ref.matches('^refs/heads/(main|master|release-[0-9][.][0-9]+)$')
            )
        - name: overlays
          value:
            - key: submodules
              expression: >-
                body.repository.name == 'tidb' ? 'false' : 'true'
            - key: git-secret-ref
              expression: >-
                body.repository.full_name == 'pingcap/tiflash' ? 'github-ssh-secret' : ''
            - key: timeout
              expression: >-
                {
                'pingcap/monitoring': '30m',
                'pingcap/ng-monitoring': '30m',
                'pingcap/ticdc': '20m',
                'pingcap/tidb': '1h',
                'pingcap/tidb-dashboard': '40m',
                'pingcap/tiflash': '3h',
                'pingcap/tiflow': '40m',
                'pingcap/tiproxy': '30m',
                'tikv/pd': '40m',
                'tikv/tikv': '2h30m',
                }[body.repository.full_name]
  bindings:
    - ref: github-branch-push
    - ref: gcp-classic-build-params
    - { name: component, value: $(body.repository.name) }
    - { name: profile, value: release }
    - { name: timeout, value: $(extensions.timeout) }
    - { name: submodules, value: $(extensions.submodules) }
    - { name: git-secret-ref, value: $(extensions.git-secret-ref) }

  template:
    ref: build-component-darwin-mac
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: github-push-build-community-fts-darwin # migrated from prod2 along with the linux builds.
  labels:
    type: github-branch-push
    profile: community
spec:
  interceptors:
    - name: filter on repo and branch
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            body.repository.full_name in ['pingcap/tidb', 'pingcap/tiflash', 'tikv/tikv']
            &&
            body.ref.matches('^refs/heads/(feature/fts|release-fts-[0-9]+)$')
        - name: overlays
          value:
            - key: submodules
              expression: >-
                body.repository.name == 'tidb' ? 'false' : 'true'
            - key: git-secret-ref
              expression: >-
                body.repository.full_name == 'pingcap/tiflash' ? 'github-ssh-secret' : ''
            - key: timeout
              expression: >-
                {
                'pingcap/tidb': '1h',
                'pingcap/tiflash': '3h',
                'tikv/tikv': '3h',
                }[body.repository.full_name]
  bindings:
    - ref: github-branch-push
    - ref: gcp-classic-build-params
    - { name: component, value: $(body.repository.name) }
    - { name: profile, value: release }
    - { name: timeout, value: $(extensions.timeout) }
    - { name: submodules, value: $(extensions.submodules) }
    - { name: git-secret-ref, value: $(extensions.git-secret-ref) }
  template:
    ref: build-component-darwin-mac

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: notified-successful-image-delivery-tidbx
  labels:
    type: ce-notify
spec:
  interceptors:
    - name: filter on images
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            body.images.exists(img, img.contains('nextgen') || img.contains('next-gen') || img.contains('tidbx'))

  bindings:
    # - { name: ce-context, value: $(extensions.ce-context) }
    - { name: data, value: $(extensions.ce-data) } # from event-listener
  template:
    spec:
      params:
        - name: data
      resourcetemplates:
        - apiVersion: tekton.dev/v1
          kind: TaskRun
          metadata:
            generateName: pingcap-notify-to-deliver-images-to-cloud-tidbx-
          spec:
            params:
              - name: src
                value: $(tt.params.data)
              - name: publisher-url
                value: "http://publisher.publisher.svc"
            taskRef:
              name: pingcap-notify-to-deliver-images-to-cloud-tidbx

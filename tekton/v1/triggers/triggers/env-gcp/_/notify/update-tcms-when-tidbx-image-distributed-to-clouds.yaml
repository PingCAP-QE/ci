apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: update-tcms-when-tidbx-image-distributed-to-clouds
  labels:
    type: github-issue-comment
spec:
  interceptors:
    - name: filter on github repo and comment content
      ref: { name: cel }
      params:
        - name: filter
          # Filter conditions (all must pass):
          # 1. The event is a newly created issue comment on the image controller repo
          # 2. Comment body contains a META JSON block (<!-- META={...} -->)
          # 3. The delivery succeeded (status=="success", or the legacy success title
          #    for comments produced before the status field existed)
          # 4. The META block has a non-empty "images" array
          value: >-
            body.action == 'created'
            &&
            body.repository.full_name == 'tidbcloud/docker-image-controller'
            &&
            body.comment.body != null
            &&
            body.comment.body.matches('<!--\\s*META={.+?\\s*-->')
            &&
            (body.comment.body.contains('Fast Image Delivery Results')
            ||
            ('status' in body.comment.body.split('<!--')[1].split('-->')[0].replace('META=', '').parseJSON()
            &&
            body.comment.body.split('<!--')[1].split('-->')[0].replace('META=', '').parseJSON().status == 'success'))
            &&
            size(body.comment.body.split('<!--')[1].split('-->')[0].replace('META=', '').parseJSON().images) > 0
        - name: overlays
          value:
            - key: images
              expression: body.comment.body.split('<!--')[1].split('-->')[0].replace('META=', '').parseJSON().images.marshalJSON()

  bindings:
    - ref: github-issue-comment
    - { name: images, value: $(extensions.images) }

  template:
    spec:
      params:
        - name: images
      resourcetemplates:
        - apiVersion: tekton.dev/v1
          kind: TaskRun
          metadata:
            generateName: pingcap-notify-to-add-image-records-to-tcms-
          spec:
            taskRef:
              name: pingcap-notify-to-update-tcms-tidbx
            params:
              - name: images
                value: $(tt.params.images)

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: fake-github-tag-create-single-platform
  labels:
    type: fake-github-tag-create
spec:
  interceptors:
    - name: resolve product
      ref: { name: cel }
      params:
        - name: overlays
          value:
            - key: build
              expression: >-
                {
                  'product': (header.canonical('ce-paramProduct') != '' ? header.canonical('ce-paramProduct') : body.repository.name),
                  'serverless': (header.canonical('ce-paramProduct') in ['tidb-cse', 'pd-cse', 'tidb-operator-cse', 'cassandra-on-mysql', 'qdrant-on-tidb'] ||
                  (header.canonical('ce-paramProduct') == '' && body.repository.full_name in ['tidbcloud/tidb-cse', 'tidbcloud/pd-cse', 'tidbcloud/tidb-operator-cse', 'tidbcloud/cassandra-on-mysql', 'tidbcloud/qdrant-on-tidb']))
                }
    - name: filter on repo
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            extensions.build.serverless ?
            (header.canonical('ce-type') == 'net.pingcap.tibuild.devbuild.create' && header.canonical('ce-paramPlatform') in ['linux/amd64',
            'linux/arm64']) : (((header.canonical('ce-paramGithubRepo') != '' && extensions.build.product in ['tici', 'ng-monitoring',
            'ticdc', 'tidb', 'tidb-binlog', 'tidb-dashboard', 'tidb-operator', 'tidb-tools', 'tiflash',
            'tiflow', 'tiproxy', 'cloud-storage-engine', 'tiflash-cse', 'pd', 'tikv']) || body.repository.full_name in [ 'pingcap-inc/tici',
            'pingcap/ng-monitoring', 'pingcap/ticdc', 'pingcap/tidb', 'pingcap/tidb-binlog', 'pingcap/tidb-dashboard',
            'pingcap/tidb-operator', 'pingcap/tidb-tools', 'pingcap/tiflash', 'pingcap/tiflow', 'pingcap/tiproxy',
            'tidbcloud/cloud-storage-engine', 'tidbcloud/tiflash-cse', 'tikv/pd', 'tikv/tikv' ]) &&
            body.ref.matches('^v[0-9]+[.][0-9]+[.][0-9]+(-.+)?$') && header.canonical('ce-paramPlatform') in [ 'linux/amd64',
            'linux/arm64' ])
        - name: overlays
          value:
            - key: resource-config
              expression: >-
                {
                  'tidb-cse': {'timeout': '90m', 'sourceWsSize': '80Gi', 'cpu': '8', 'memory': '32Gi'},
                  'pd-cse': {'timeout': '90m', 'sourceWsSize': '30Gi', 'cpu': '4', 'memory': '16Gi'},
                  'tidb-operator-cse': {'timeout': '90m', 'sourceWsSize': '30Gi', 'cpu': '4', 'memory': '16Gi'},
                  'cassandra-on-mysql': {'timeout': '90m', 'sourceWsSize': '30Gi', 'cpu': '4', 'memory': '16Gi'},
                  'qdrant-on-tidb': {'timeout': '3h', 'sourceWsSize': '80Gi', 'cpu': '8', 'memory': '32Gi'},
                  'tici': {
                    'timeout': '2h',
                    'sourceWsSize': '50Gi',
                    'cpu': '8',
                    'memory': '32Gi'
                  },
                  'ng-monitoring': {
                    'timeout': '30m',
                    'sourceWsSize': '20Gi',
                    'cpu': '2',
                    'memory': '4Gi'
                  },
                  'ticdc': {
                    'timeout': '20m',
                    'sourceWsSize': '50Gi',
                    'cpu': '4',
                    'memory': '16Gi'
                  },
                  'tidb': {
                    'timeout': '40m',
                    'sourceWsSize': '50Gi',
                    'cpu': '6',
                    'memory': '24Gi'
                  },
                  'tidb-binlog': {
                    'timeout': '2h',
                    'sourceWsSize': '100Gi',
                    'cpu': '8',
                    'memory': '32Gi'
                  },
                  'tidb-dashboard': {
                    'timeout': '40m',
                    'sourceWsSize': '20Gi',
                    'cpu': '2',
                    'memory': '4Gi'
                  },
                  'tidb-operator': {
                    'timeout': '30m',
                    'sourceWsSize': '10Gi',
                    'cpu': '2',
                    'memory': '8Gi'
                  },
                  'tidb-tools': {
                    'timeout': '1h',
                    'sourceWsSize': '10Gi',
                    'cpu': '4',
                    'memory': '16Gi'
                  },
                  'tiflash': {
                    'timeout': '5h',
                    'sourceWsSize': '100Gi',
                    'cpu': '12',
                    'memory': '48Gi'
                  },
                  'tiflow': {
                    'timeout': '40m',
                    'sourceWsSize': '50Gi',
                    'cpu': '6',
                    'memory': '24Gi'
                  },
                  'tiproxy': {
                    'timeout': '30m',
                    'sourceWsSize': '20Gi',
                    'cpu': '3',
                    'memory': '12Gi'
                  },
                  'cloud-storage-engine': {
                    'timeout': '2h30m',
                    'sourceWsSize': '100Gi',
                    'cpu': '12',
                    'memory': '48Gi'
                  },
                  'tiflash-cse': {
                    'timeout': '2h',
                    'sourceWsSize': '100Gi',
                    'cpu': '12',
                    'memory': '48Gi'
                  },
                  'pd': {
                    'timeout': '40m',
                    'sourceWsSize': '50Gi',
                    'cpu': '6',
                    'memory': '24Gi'
                  },
                  'tikv': {
                    'timeout': '2h30m',
                    'sourceWsSize': '100Gi',
                    'cpu': '12',
                    'memory': '56Gi'
                  }
                }[extensions.build.serverless ? extensions.build.product : body.repository.name]
            - key: custom-params
              expression: >-
                {
                  'git-credentials-secret': extensions.build.serverless ? 'github-pat-secret' : 'no-build-credentials',
                  'deliver-artifacts': extensions.build.serverless ? 'false' : 'true',
                  'require-artifacts': extensions.build.serverless ? 'true' : 'false',
                  'builder-image': header.canonical('ce-paramBuilderImage'),
                  'profile': extensions.build.serverless ? 'release' : header.canonical('ce-paramProfile') == '' ?
                  'release' : (header.canonical('ce-paramProfile') == 'community' ? 'release' : header.canonical('ce-paramProfile')),
                  'os': header.canonical('ce-paramPlatform').split('/')[0],
                  'arch': header.canonical('ce-paramPlatform').split('/')[1],
                  'external-git-ref': header.canonical('ce-paramPluginGitRef').replace('branch/', '').replace('tag/', ''),
                  'fetch-external': (body.repository.name == 'tidb' && header.canonical('ce-paramProfile') == 'enterprise') ? 'true' : 'false',
                }
            - key: component
              expression: >-
                extensions.build.serverless ?
                extensions.build.product :
                body.repository.full_name.startsWith('tidbcloud/') ? {
                  'tidbcloud/tiflash-cse': 'tiflash',
                  'tidbcloud/cloud-storage-engine': 'tikv',
                }[body.repository.full_name]
                : body.repository.name
            - key: registry
              expression: >-
                header.canonical('ce-type').startsWith('net.pingcap.tibuild.hotfix.') ?
                'us-docker.pkg.dev/pingcap-testing-account/hotfix' :
                'us-docker.pkg.dev/pingcap-testing-account/dev'

            - key: source
              expression: >-
                {
                  'ref': body.ref,
                  'revision': extensions.build.serverless && header.canonical('ce-paramGitRevision') != '' ? header.canonical('ce-paramGitRevision') : body.ref,
                  'refspec': extensions.build.serverless ? (header.canonical('ce-paramGitRevision') != '' ? '+' + header.canonical('ce-paramGitRevision') + ':refs/devbuild/source' : '+refs/tags/' + body.ref + ':refs/tags/' + body.ref) : '+refs/heads/*:refs/heads/*'
                }

  bindings:
    - { name: git-url, value: $(body.repository.clone_url) }
    - { name: git-ref, value: $(extensions.source.ref) }
    - { name: git-revision, value: $(extensions.source.revision) }
    - { name: git-refspec, value: $(extensions.source.refspec) }
    - ref: gcp-dev-build-params
    - { name: git-credentials-secret, value: $(extensions.custom-params.git-credentials-secret) }
    - { name: deliver-artifacts, value: $(extensions.custom-params.deliver-artifacts) }
    - { name: require-artifacts, value: $(extensions.custom-params.require-artifacts) }
    - { name: os, value: $(extensions.custom-params.os) }
    - { name: arch, value: $(extensions.custom-params.arch) }

  template:
    ref: build-component-single-platform

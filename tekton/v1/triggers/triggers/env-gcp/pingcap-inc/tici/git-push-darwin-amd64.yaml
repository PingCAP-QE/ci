apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: git-push-pingcap-inc-tici-darwin-amd64
  labels:
    type: github-branch-push
    github-owner: pingcap-inc
    github-repo: tici
spec:
  interceptors:
    - name: filter on repo owner and name and branches
      ref: { name: cel }
      params:
        - name: filter
          value: >-
            body.repository.full_name == 'pingcap-inc/tici'
            &&
            body.ref.matches('^refs/heads/master$')
  bindings:
    - ref: github-branch-push
    - ref: gcp-classic-build-params
    - { name: component, value: $(body.repository.name) }
    - { name: profile, value: release }
    - { name: os, value: darwin }
    - { name: arch, value: amd64 }
    - { name: git-secret-ref, value: github-pat-secret }
    - { name: timeout, value: 2h }
  template:
    ref: build-component-darwin-mac
